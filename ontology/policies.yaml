scheduling_policies:
  activity:any_workout:
    term: any_workout
    applies_when: Prefer either observable workout slot.
    effects:
    - match:
        near: workout_before
      level: prefer
    - match:
        near: workout_after
      level: prefer
    warning: false
  activity:post_workout:
    term: post_workout
    applies_when: Prefer the observable post-workout slot.
    effects:
    - match:
        near: workout_after
      level: prefer
    warning: false
  activity:pre_workout:
    term: pre_workout
    applies_when: Prefer the observable pre-workout slot.
    effects:
    - match:
        near: workout_before
      level: prefer
    warning: false
  intake:empty_preferred:
    term: empty_preferred
    applies_when: Prefer a slot without food when feasible.
    effects:
    - match:
        food: false
      level: prefer
    - match:
        food: true
      level: avoid
    warning: false
  intake:fat_meal_required:
    term: fat_meal_required
    applies_when: Prefer a slot with food as the current approximation of a fat-containing meal.
    effects:
    - match:
        food: true
      level: prefer_strong
    - match:
        food: false
      level: avoid
    warning: false
  intake:food_neutral:
    term: food_neutral
    applies_when: Food state does not drive slot assignment.
    effects: []
    warning: false
  intake:food_preferred:
    term: food_preferred
    applies_when: Prefer a slot with food when feasible.
    effects:
    - match:
        food: true
      level: prefer
    warning: false
  intake:food_required:
    term: food_required
    applies_when: Prefer a slot with food; retain the soft preference when food is unavailable.
    effects:
    - match:
        food: true
      level: prefer_strong
    - match:
        food: false
      level: avoid
    warning: false
  timing:energy_like:
    term: energy_like
    applies_when: Prefer wake/day slots and avoid sleep when feasible.
    effects:
    - match:
        near: wake
      level: prefer
    - match:
        near: day_meal
      level: prefer
    - match:
        near: sleep
      level: avoid
    warning: false
  timing:sleep_disruptive:
    term: sleep_disruptive
    applies_when: Avoid the observable sleep slot when feasible.
    effects:
    - match:
        near: sleep
      level: avoid
    warning: false
  timing:sleep_support:
    term: sleep_support
    applies_when: Prefer the observable sleep slot.
    effects:
    - match:
        near: sleep
      level: prefer
    warning: false
  risk:b6_neuropathy_long_term:
    term: b6_neuropathy_long_term
    applies_when: Use for pyridoxine HCl/pyridoxine supplement forms when chronic
      intake should be reviewed separately from active P5P forms.
    effects: []
    warning: true
    action: Review cumulative daily pyridoxine HCl/B6 intake across active products.
  risk:biotin_lab_interference:
    term: biotin_lab_interference
    applies_when: Use for supplemental biotin/B7 forms where lab-test interpretation
      should include a biotin-interference check.
    effects: []
    warning: true
    action: Ask about biotin before interpreting thyroid, troponin, or other immunoassay
      results; pause timing should follow the lab or clinician's guidance.
  risk:bleeding_med_interaction:
    term: bleeding_med_interaction
    applies_when: Use for nattokinase, high-signal omega-3 sources, antiplatelet botanicals,
      and other substances where anticoagulant/antiplatelet context should be reviewed.
    effects: []
    warning: true
  risk:cyp450_med_interaction:
    term: cyp450_med_interaction
    applies_when: Use when a substance has credible CYP interaction context, especially
      when product review should look for narrow-therapeutic-index or CNS medications.
    effects: []
    warning: true
    action: Review medication list for CYP-sensitive drugs before treating this as
      routine background support.
  risk:glucose_med_interaction:
    term: glucose_med_interaction
    applies_when: Use for substances or supplement contexts where glucose-lowering,
      insulin-sensitizing, or insulin-mimetic effects make antidiabetes-medication
      review practical.
    effects: []
    warning: true
    action: Review antidiabetes medication context and hypoglycemia risk before treating
      this as routine background support.
  risk:hyperkalemia_med_interaction:
    term: hyperkalemia_med_interaction
    applies_when: Use for potassium-containing substances or formulas where ACEi,
      ARB, NSAID, or K-sparing diuretic context matters.
    effects: []
    warning: true
  risk:hypotension_med_interaction:
    term: hypotension_med_interaction
    applies_when: Use for PDE5 inhibitors, nitric-oxide precursors, and direct vasodilator
      substances where additive hypotension is the practical concern.
    effects: []
    warning: true
  risk:incretin_drug_medical_review:
    term: incretin_drug_medical_review
    applies_when: Use for semaglutide, tirzepatide, liraglutide, dulaglutide, exenatide,
      retatrutide, and similar incretin-mimetic drugs; do not use for ordinary glucose-support
      supplements.
    effects: []
    warning: true
    action: Review prescribing context, glycemic medications, GI tolerance, pancreatitis/gallbladder
      history, kidney dehydration risk, pregnancy planning, and product quality before
      any practical use discussion.
  risk:iron_overdose_review:
    term: iron_overdose_review
    applies_when: Use for iron supplement forms, regardless of source salt or chelate.
    effects: []
    warning: true
    action: Review iron indication, ferritin/iron status, hemochromatosis context,
      and child-safety storage before treating iron as routine background support.
  risk:liver_injury_review:
    term: liver_injury_review
    applies_when: Use for concentrated botanical extracts with credible liver-injury
      reports, such as green tea extract, especially when extract potency is unknown.
    effects: []
    warning: true
    action: Review liver disease, symptoms, extract potency, dose, and food timing
      before treating this as routine background antioxidant support.
  risk:manual_review:
    term: manual_review
    applies_when: Use when no more specific practical risk trait exists yet.
    effects: []
    warning: true
  risk:narrow_therapeutic_window:
    term: narrow_therapeutic_window
    applies_when: Use for selenium, copper, and similar narrow-window minerals.
    effects: []
    warning: true
  risk:retinol_accumulation_review:
    term: retinol_accumulation_review
    applies_when: Use for preformed vitamin A/retinol forms, not demand-regulated
      provitamin-A carotenoids.
    effects: []
    warning: true
    action: Review cumulative preformed vitamin A intake, liver context, and pregnancy
      relevance before treating retinol as routine background support.
  risk:seizure_threshold_review:
    term: seizure_threshold_review
    applies_when: Use for substances where credible clinical references advise caution
      in people with seizure history or interacting seizure-threshold-lowering drugs.
    effects: []
    warning: true
  risk:serotonergic_med_interaction:
    term: serotonergic_med_interaction
    applies_when: Use for 5-HTP and botanicals/adaptogens with documented or review-relevant
      serotonergic modulation where antidepressant or serotonin-syndrome-like context
      should be reviewed.
    effects: []
    warning: true
  risk:statin_like_monacolin_review:
    term: statin_like_monacolin_review
    applies_when: Use for red yeast rice products when monacolin content is unknown
      or when statin-like lipid-lowering activity is part of the intended rationale.
    effects: []
    warning: true
    action: Review monacolin/statin-like exposure, liver and muscle symptoms, and
      medication interaction context.
  risk:tmao_cardiometabolic_review:
    term: tmao_cardiometabolic_review
    applies_when: Use for supplemental L-carnitine forms and related precursors when
      the reviewer should surface TMAO/cardiometabolic context.
    effects: []
    warning: true
  risk:vitamin_k_anticoagulant_review:
    term: vitamin_k_anticoagulant_review
    applies_when: Use for K1 and K2 forms where warfarin or related anticoagulant
      context should be reviewed.
    effects: []
    warning: true
    action: Review warfarin/vitamin-K-antagonist therapy and intake consistency before
      changing vitamin K exposure.
  risk:zinc_copper_balance_review:
    term: zinc_copper_balance_review
    applies_when: Use for zinc supplement forms when cumulative zinc and copper balance
      should be surfaced.
    effects: []
    warning: true
    action: Review cumulative zinc intake and copper status/context for long-term
      use.
schedule_presentation:
  concern_annotations:
    include_kinds: [safety, model_gap, data_quality]
    labels:
      - {key: safety, label: Safety concerns}
      - {key: model_gap, label: Model gaps}
      - {key: data_quality, label: Data-quality concerns}
  review_tags:
    include_namespaces: [activity, intake, risk]
    exclude_policy_ids: [risk:manual_review]
  active_fact_index:
    include_namespaces: [context, effect, kind, role, quality]
    labels:
      - {key: context, label: Context memberships}
      - {key: effect, label: Effect memberships}
      - {key: kind, label: Kind memberships}
      - {key: role, label: Role memberships}
      - {key: quality, label: Quality memberships}
  zero_effect:
    condition: no_nonzero_effects
    template: No nonzero chosen-slot scheduling effect. Placement reflects compatible-slot feasibility, global load balance, and stable tie-breaking; it is not evidence for this clock time or meal condition.
