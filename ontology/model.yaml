id: https://j2h4u.github.io/supp-slotter/ontology/v1/model
name: supp_slotter_model
prefixes:
  ss: https://j2h4u.github.io/supp-slotter/ontology/v1/
  linkml: https://w3id.org/linkml/
default_prefix: ss
default_range: string
imports: [linkml:types]
enums:
  ConcernKind:
    permissible_values:
      safety:
      model_gap:
      data_quality:
  ResearchState:
    permissible_values:
      unassessed:
      anecdotal:
      searched_insufficient:
      mechanistic_only:
      supported:
  ProductUsePattern:
    permissible_values:
      not_every_day:
  MealContext:
    description: Independent logical meal-context anchor for a canonical slot.
    annotations:
      canonical_pressure_dimension: meal_context
    permissible_values:
      with_food:
      without_food:
  CircadianAnchor:
    description: Independent logical circadian anchor for a canonical slot.
    annotations:
      canonical_pressure_dimension: circadian_anchor
    permissible_values:
      wake:
      sleep:
  ExerciseAnchor:
    description: Independent logical exercise anchor for a canonical slot.
    annotations:
      canonical_pressure_dimension: exercise_anchor
    permissible_values:
      before:
      after:
  FoodEffectValue:
    description: Closed values admitted by the FoodEffect fact family.
    permissible_values:
      bioavailability_increases:
      bioavailability_decreases:
      tolerability_improves:
      tolerability_worsens:
  AcuteAlertnessEffectValue:
    description: Closed values admitted by the AcuteAlertnessEffect fact family.
    permissible_values:
      acute_alertness_increases:
  AcuteSleepEffectValue:
    description: Closed values admitted by the AcuteSleepEffect fact family.
    permissible_values:
      onset_latency_decreases:
      continuity_improves:
  PreExercisePerformanceEffectValue:
    description: Closed values admitted by the PreExercisePerformanceEffect fact family.
    permissible_values:
      performance_improves:
  PostExerciseRecoveryEffectValue:
    description: Closed values admitted by the PostExerciseRecoveryEffect fact family.
    permissible_values:
      recovery_improves:
classes:
  Ontology:
    description: Root metadata for a compiled ontology release.
    slots: [schema_version]
  Catalog:
    description: Manifest-declared authored catalog included in the ontology.
    slots: [catalog_role, catalog_path, catalog_root_class]
  IdentifiedNode:
    abstract: true
    slots: [id, label, description]
    slot_usage:
      label: {required: true}
  Substance:
    is_a: IdentifiedNode
    slots: [aliases, form, notes, concerns, knowledge_assertions]
  Product:
    is_a: IdentifiedNode
    slots: [brand, components, urls, notes, concerns, use_pattern]
  ProductComponent:
    slots: [id, substance, label, amount, notes]
    slot_usage:
      id: {required: true, pattern: '^cmp_[a-z0-9][a-z0-9_:-]*$'}
  CompositionRole:
    description: Stable composition identity joining one product to one substance.
    annotations:
      identity_scope: global
      identity_uniqueness: required
    slots: [id, product, substance]
    slot_usage:
      id: {required: true, pattern: '^cmp_[a-z0-9][a-z0-9_:-]*$'}
      product: {required: true, range: Product, inlined: false, multivalued: false}
      substance: {required: true, range: Substance, inlined: false, multivalued: false}
  Concern:
    slots: [concern_kind, concern_text]
  KnowledgeAssertion:
    slots: [knowledge_category, knowledge_value, research_state, sources]
  Pillbox:
    is_a: IdentifiedNode
    annotations:
      source_shape: keyed_map
      stack_linkage: required_reference
    slots: [stack, slots]
    slot_usage:
      stack: {required: true, range: Stack, inlined: false, multivalued: false}
      slots: {required: true, minimum_cardinality: 1, multivalued: true, range: Slot, inlined: true, inlined_as_list: true}
  Slot:
    is_a: IdentifiedNode
    annotations:
      identity_scope: global
      identity_uniqueness: required
      order_scope: topology
      order_uniqueness: required
      unbounded_group: true
    slots: [order, label, meal_context, circadian_anchor, exercise_anchor]
    slot_usage:
      label: {required: true, multivalued: false}
      order: {required: true, minimum_value: 1, multivalued: false}
      meal_context: {range: MealContext, multivalued: false, annotations: {canonical_pressure_dimension: meal_context}}
      circadian_anchor: {range: CircadianAnchor, multivalued: false, annotations: {canonical_pressure_dimension: circadian_anchor}}
      exercise_anchor: {range: ExerciseAnchor, multivalued: false, annotations: {canonical_pressure_dimension: exercise_anchor}}
  LogicalSlot:
    description: Shadow canonical logical intake group with independent optional anchors.
    annotations:
      identity_scope: global
      identity_uniqueness: required
      order_scope: topology
      order_uniqueness: required
      unbounded_group: true
    slots: [id, label, order, meal_context, circadian_anchor, exercise_anchor]
    slot_usage:
      id: {required: true, pattern: '^[a-z][a-z0-9_:-]*$'}
      label: {required: false, multivalued: false}
      order: {required: true, minimum_value: 1, multivalued: false}
      meal_context: {range: MealContext, multivalued: false, annotations: {canonical_pressure_dimension: meal_context}}
      circadian_anchor: {range: CircadianAnchor, multivalued: false, annotations: {canonical_pressure_dimension: circadian_anchor}}
      exercise_anchor: {range: ExerciseAnchor, multivalued: false, annotations: {canonical_pressure_dimension: exercise_anchor}}
  LogicalSlotTopology:
    description: Canonical topology containing unbounded logical intake groups.
    annotations:
      no_capacity_model: true
    slots: [id, label, slots]
    slot_usage:
      id: {required: true, pattern: '^[a-z][a-z0-9_:-]*$'}
      label: {required: false, multivalued: false}
      slots: {required: true, minimum_cardinality: 1, multivalued: true, range: LogicalSlot, inlined: true, inlined_as_list: true}
  Stack:
    is_a: IdentifiedNode
    annotations:
      source_shape: keyed_map
      source_key_pattern: '^[a-z][a-z0-9_]*$'
      entry_uniqueness: required
    slots: [entries, tracked_entries]
    slot_usage:
      label: {required: false}
  StackEntry:
    slots: [product]
  TrackedUnassignedEntry:
    description: An explicitly retained product excluded from all active routing.
    slots: [product, reason]
    slot_usage:
      product: {required: true, range: Product, inlined: false, multivalued: false}
      reason: {required: true, range: string, multivalued: false}
  Dashboard:
    is_a: IdentifiedNode
    annotations:
      selector_uniqueness: required
      declares_context_uniqueness: required
      source_shape: mapping
      source_required: id,name,description,selectors
      source_any_of: benefit,risk
    slots: [benefit_description, risk_description, selectors, declares_context]
    slot_usage:
      id: {required: true, pattern: '^[a-z][a-z0-9_]*$'}
      description: {required: true}
      selectors: {required: true, minimum_cardinality: 1, multivalued: true, inlined: true, inlined_as_list: true}
  DashboardSelector:
    slots: [category, selector_term]
    slot_usage:
      category: {required: true, pattern: '^[a-z][a-z0-9_]*$'}
      selector_term: {required: true, pattern: '^[a-z][a-z0-9_]*$'}
  Selector:
    abstract: true
    slots: [selector_id]
  EntitySelector:
    is_a: Selector
    slots: [entity_id]
  CardConcern:
    description: A validation-ready concern embedded in a source card.
    slots: [kind, text]
    slot_usage:
      # Each concern has exactly one classification.  LinkML's implicit
      # cardinality for an untyped slot is multivalued, so state this
      # explicitly to keep the authored scalar ``kind`` contract.
      kind: {required: true, range: ConcernKind, multivalued: false}
      text: {required: true}
  CardKnowledge:
    description: Nested knowledge namespaces carried by a source substance card.
    annotations:
      assertion_value_uniqueness: required
    # Concrete knowledge fields are compiler-generated from the authored
    # vocabulary catalog.  The base schema owns only this envelope.
  SubstanceCard:
    description: Source-facing canonical substance card contract.
    slots: [id, name, form, aliases, notes, concerns, knowledge]
    slot_usage:
      id: {required: true, pattern: '^sub_[a-z0-9]{10}$'}
      name: {required: true, pattern: '^.+$'}
      aliases: {multivalued: true, inlined_as_list: true}
      concerns: {multivalued: true, range: CardConcern, inlined: true, inlined_as_list: true}
      knowledge: {range: CardKnowledge, inlined: true}
  ProductCard:
    description: Source-facing canonical product card contract.
    annotations:
      component_uniqueness: required
      component_uniqueness_source: components[]
      component_uniqueness_field: substance
    slots: [id, name, components, brand, urls, notes, concerns, use_pattern]
    slot_usage:
      id: {required: true, pattern: '^prd_[a-z0-9]{10}$'}
      name: {required: true, pattern: '^.+$'}
      components: {required: true, minimum_cardinality: 1, multivalued: true, range: ProductComponent, inlined: true, inlined_as_list: true}
      use_pattern: {range: ProductUsePattern, multivalued: false}
      concerns: {multivalued: true, range: CardConcern, inlined: true, inlined_as_list: true}
slots:
  schema_version: {}
  catalog_role: {}
  catalog_path: {}
  catalog_root_class: {}
  id: {identifier: true, required: true, range: string}
  name:
  text:
  action:
  source_selector:
  target_selector:
  label:
  description: {}
  aliases: {multivalued: true}
  form: {}
  knowledge:
  notes: {}
  brand: {}
  components: {multivalued: true, range: ProductComponent, inlined: true, inlined_as_list: true}
  urls: {multivalued: true}
  substance: {required: true, range: Substance, inlined: false}
  amount: {}
  concerns: {multivalued: true, range: Concern, inlined: true, inlined_as_list: true}
  use_pattern: {range: ProductUsePattern, multivalued: false}
  kind: {}
  knowledge_assertions: {multivalued: true, range: KnowledgeAssertion, inlined: true, inlined_as_list: true}
  concern_kind: {range: ConcernKind}
  concern_text: {}
  knowledge_category: {}
  knowledge_value: {}
  research_state: {range: ResearchState}
  sources: {multivalued: true}
  slots: {multivalued: true, range: Slot, inlined: true, inlined_as_list: true}
  order: {range: integer}
  meal_context: {range: MealContext, multivalued: false}
  circadian_anchor: {range: CircadianAnchor, multivalued: false}
  exercise_anchor: {range: ExerciseAnchor, multivalued: false}
  entries: {multivalued: true, range: StackEntry, inlined: true, inlined_as_list: true}
  tracked_entries: {multivalued: true, range: TrackedUnassignedEntry, inlined: true, inlined_as_list: true}
  product: {required: true, range: Product, inlined: false}
  reason: {}
  stack: {required: true, range: Stack}
  benefit_description: {}
  risk_description: {}
  selectors: {multivalued: true, range: DashboardSelector, inlined: true, inlined_as_list: true}
  declares_context: {multivalued: true}
  category: {}
  selector_term: {}
  selector_id: {identifier: true, required: true}
  entity_id: {required: true, range: IdentifiedNode, inlined: false}
