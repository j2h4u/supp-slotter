# Canonical operational scheduling constraints. These preserve historical planner
# behavior while explicitly separating it from biochemical or ontological claims.
scheduling_constraints:
  sc_zinc_copper_separate_slots:
    operation: separate_products_same_slot
    source_selector: {entity: {entity_id: sub_8554n79hve}}
    target_selector: {entity: {entity_id: sub_844a0cc551}}
    rationale: Zinc and copper can compete for absorption when co-administered.
    action: Keep zinc and copper away from the same slot when they are in separate products.
  sc_calcium_iron_separate_slots:
    operation: separate_products_same_slot
    source_selector: {entity: {entity_id: sub_vvmld46dbz}}
    target_selector: {entity: {entity_id: sub_ses5czfzi1}}
    rationale: Calcium and iron evidence is dose- and context-dependent; dose is unknown, so no hard rule or computable 2-4 hour promise is justified.
    action: Prefer different slots for calcium and iron when feasible; no calculated separation interval.
    blocks_slots: false
    scores_advisory: true
    score_delta: -1
  sc_calcium_zinc_separate_slots:
    operation: separate_products_same_slot
    source_selector: {entity: {entity_id: sub_vvmld46dbz}}
    target_selector: {entity: {entity_id: sub_8554n79hve}}
    rationale: Calcium can compete with zinc for absorption when co-administered.
    action: Keep calcium and zinc away from the same slot when they are in separate products.
  sc_tocopherol_tocotrienol_separate_slots:
    operation: separate_products_same_slot
    source_selector: {entity: {entity_id: sub_844a87d72b}}
    target_selector: {entity: {entity_id: sub_5723eafac4}}
    rationale: Vitamin E tocopherols and tocotrienols can compete for absorption and tissue uptake when co-administered.
    action: Keep tocopherol and tocotrienol products away from the same slot.
