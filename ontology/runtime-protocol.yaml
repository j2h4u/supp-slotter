id: https://j2h4u.github.io/supp-slotter/ontology/v1/runtime-protocol
name: supp_slotter_runtime_protocol
title: Scheduling runtime protocol and executable policy contract
description: Mechanics-only protocol plus typed runtime policy semantics.
prefixes:
  ss: https://j2h4u.github.io/supp-slotter/ontology/v1/
  linkml: https://w3id.org/linkml/
default_prefix: ss
default_range: string
imports:
  - linkml:types
  - model

enums:
  ConstraintExecutionOperation:
    permissible_values:
      separate_products_same_slot:
  ConstraintExecutionAggregation:
    permissible_values:
      distinct_constraint:
  ConstraintExecutionMatchDirection:
    permissible_values:
      symmetric:
      directed:
  RelationWarningFilterField:
    permissible_values:
      assertion_kind:
      semantic_family:
  RelationWarningActiveSide:
    permissible_values:
      both:
      source:
      target:
  GroomingWorkUnit:
    permissible_values:
      substance_card:
  GroomingEligibility:
    permissible_values:
      active_reachable:
      unassessed_owned_item:
  GroomingRankField:
    permissible_values:
      active_unique_product_count:
      open_owned_item_count:
      substance_id:
  GroomingRankDirection:
    permissible_values:
      ascending:
      descending:
  GroomingRelationOwner:
    permissible_values:
      lowest_stable_substance_id:

classes:
  Condition:
    slots: [operator, field, value, values, conditions, selector, left, right]
    slot_usage:
      conditions: {inlined: true, inlined_as_list: true}
      value: {required: false}
      left: {inlined: true}
      right: {inlined: true}
  Action:
    slots: [operator, field, value, weight, trace_key]
  RuntimePolicyCatalog:
    description: Typed executable policy contract consumed by planner runtime.
    slots: [id, engine_contract, glue_contract, source_kind_values, effect_match_dimensions, assignment_axes, slot_near_values, constraint_execution_policies, effect_scoring, prefer_with_policy, warning_types, warning_emitters, warning_trait_actions, concern_catalog, relation_warning_rules, relation_presence_statuses, selector_form_capabilities, dashboard_state_catalog, grooming_policy, runtime_projection]
    slot_usage:
      source_kind_values: {required: true, inlined: true, inlined_as_list: true}
      engine_contract: {required: true, inlined: true}
      effect_match_dimensions: {required: true, inlined: true, inlined_as_list: true}
      assignment_axes: {required: true, inlined: true, inlined_as_list: true}
      slot_near_values: {required: true, multivalued: true}
      constraint_execution_policies: {required: true, inlined: true, inlined_as_list: true}
      effect_scoring: {required: true, inlined: true}
      prefer_with_policy: {required: true, inlined: true}
      warning_types: {required: true, inlined: true, inlined_as_list: true}
      warning_emitters: {required: true, inlined: true, inlined_as_list: true}
      warning_trait_actions: {required: true, inlined: true, inlined_as_list: true}
      concern_catalog: {required: true, inlined: true, inlined_as_list: true}
      relation_warning_rules: {required: true, inlined: true, inlined_as_list: true}
      relation_presence_statuses: {required: true, inlined: true, inlined_as_list: true}
      selector_form_capabilities: {required: true, inlined: true, inlined_as_list: true}
      dashboard_state_catalog: {required: true, inlined: true}
      grooming_policy: {required: true, inlined: true}
      runtime_projection: {required: true, inlined: true, inlined_as_list: true}
      glue_contract: {required: true, inlined: true}
  RuntimeGlueContract:
    slots:
      - id
      - inactive_stack_name
      - source_kinds
      - source_kind_roles
      - relation_warning_filter_fields
      - relation_warning_active_sides
      - relation_presence_active_sides
      - relation_presence_truth_table
      - relation_endpoint_selector_kinds
      - relation_selector_forms
      - warning_emitter_ids
      - prefer_with_source_fields
      - prefer_with_target_resolutions
      - prefer_with_pair_modes
    slot_usage:
      id: {required: true}
      inactive_stack_name: {required: true}
      source_kinds: {required: true, multivalued: true}
      source_kind_roles: {required: true, multivalued: true}
      relation_warning_filter_fields: {required: true, multivalued: true, range: RelationWarningFilterField}
      relation_warning_active_sides: {required: true, multivalued: true, range: RelationWarningActiveSide}
      relation_presence_active_sides: {required: true, multivalued: true}
      relation_presence_truth_table: {required: true, multivalued: true, range: RuntimeRelationPresenceTruthState, inlined: true, inlined_as_list: true}
      relation_endpoint_selector_kinds: {required: true, multivalued: true}
      relation_selector_forms: {required: true, multivalued: true}
      warning_emitter_ids: {required: true, multivalued: true}
      prefer_with_source_fields: {required: true, multivalued: true}
      prefer_with_target_resolutions: {required: true, multivalued: true}
      prefer_with_pair_modes: {required: true, multivalued: true}
  RuntimeEngineContract:
    description: Versioned observable scheduler contract. Values describe the generic execution protocol; they are not supplement facts.
    slots: [id, protocol_version, result_mode, semantics, conformance_scenarios]
    slot_usage:
      id: {required: true}
      protocol_version: {required: true}
      result_mode: {required: true}
      semantics: {required: true, inlined: true, inlined_as_list: true}
      conformance_scenarios: {required: true, inlined: true, inlined_as_list: true}
  RuntimeEngineSemantic:
    slots: [id, category, rule, source_of_truth]
    slot_usage:
      id: {required: true}
      category: {required: true}
      rule: {required: true}
      source_of_truth: {required: true}
  RuntimeEngineConformanceScenario:
    slots: [id, semantic, fixture, expected]
    slot_usage:
      id: {required: true}
      semantic: {required: true}
      fixture: {required: true}
      expected: {required: true}
  RuntimeProjectionDescriptor:
    slots: [id, target, source, children]
    slot_usage:
      target: {required: true}
      children: {inlined: true, inlined_as_list: true, range: RuntimeProjectionDescriptor}
  RuntimeSourceKindValuePolicy:
    slots: [id, source_kind, applies_to]
    slot_usage:
      source_kind: {required: true}
      applies_to: {required: true}
  RuntimeEffectMatchDimensionPolicy:
    slots: [id, key, slot_field, value_type]
    slot_usage: {key: {required: true}, slot_field: {required: true}, value_type: {required: true}}
  RuntimeAssignmentAxisPolicy:
    slots: [id, axis, order, assignment_source, assignment_field, minimum_cardinality, maximum_cardinality]
    slot_usage:
      axis: {required: true}
      order: {required: true}
      assignment_source: {required: true}
      assignment_field: {required: true}
      minimum_cardinality: {required: true}
      maximum_cardinality: {required: true}
  RuntimeEffectScore:
    slots: [id, level, score]
    slot_usage: {level: {required: true}, score: {required: true}}
  RuntimeEffectScoringPolicy:
    slots: [id, aggregation_mode, objective_function, balance_penalty_expression, tie_break, scores, balance_weight, prefer_with_bonus]
    slot_usage:
      aggregation_mode: {required: true}
      objective_function: {required: true}
      balance_penalty_expression: {required: true}
      tie_break: {required: true}
      scores: {required: true, inlined: true, inlined_as_list: true}
      balance_weight: {required: true}
      prefer_with_bonus: {required: true}
  RuntimePreferWithPolicy:
    slots: [id, source_field, target_resolution, pair_mode]
    slot_usage:
      source_field: {required: true}
      target_resolution: {required: true}
      pair_mode: {required: true}
  RuntimeConstraintExecutionPolicy:
    slots: [id, operation, match_direction, aggregation, selector_resolution, blocks_slots, scores_advisory, score_delta]
    slot_usage:
      operation: {required: true, range: ConstraintExecutionOperation}
      match_direction: {required: true, range: ConstraintExecutionMatchDirection}
      aggregation: {required: true, range: ConstraintExecutionAggregation}
      selector_resolution: {required: true}
      blocks_slots: {required: true}
      scores_advisory: {required: true}
      score_delta: {required: true}
  RuntimeWarningTypePolicy:
    slots: [id, warning_type, label, action_text]
    slot_usage: {warning_type: {required: true}, label: {required: true}, action_text: {required: true}}
  RuntimeWarningEmitterPolicy:
    slots: [id, emitter, warning_type, default_message]
    slot_usage: {emitter: {required: true}, warning_type: {required: true}, default_message: {required: true}}
  RuntimeWarningTraitActionPolicy:
    slots: [id, trait_id, action_text]
    slot_usage: {trait_id: {required: true}, action_text: {required: true}}
  RuntimeConcernCatalogEntry:
    slots: [id, concern_kind, warning_type]
    slot_usage:
      concern_kind: {required: true, range: ConcernKind}
      warning_type: {required: true}
  RuntimeRelationWarningRule:
    slots: [id, relation_kind, warning_type, filter_field, filter_value, active_side, reverse_output]
    slot_usage:
      relation_kind: {required: true}
      warning_type: {required: true}
      filter_field: {required: true, range: RelationWarningFilterField}
      filter_value: {required: true}
      active_side: {required: true, range: RelationWarningActiveSide}
      reverse_output: {required: false}
  RuntimeRelationPresenceStatusPolicy:
    slots: [id, status, source_active, target_active, description]
    slot_usage:
      status: {required: true}
      source_active: {required: true}
      target_active: {required: true}
      description: {required: true}
  RuntimeRelationPresenceTruthState:
    slots: [source_active, target_active]
    slot_usage:
      source_active: {required: true}
      target_active: {required: true}
  RuntimeSelectorFormCapability:
    slots: [id, selector_form, endpoint_kind, show_match_details]
    slot_usage:
      selector_form: {required: true}
      endpoint_kind: {required: true}
      show_match_details: {required: true}
  RuntimeDashboardStateCatalog:
    slots: [usage_states, product_tracking_states, usage_truth_table, product_tracking_truth_table]
    slot_usage:
      usage_states: {required: true, inlined: true, inlined_as_list: true}
      product_tracking_states: {required: true, inlined: true, inlined_as_list: true}
      usage_truth_table: {required: true, inlined: true, inlined_as_list: true}
      product_tracking_truth_table: {required: true, inlined: true, inlined_as_list: true}
  RuntimeDashboardUsageStateDefinition:
    slots: [id, state, label, order]
    slot_usage:
      state: {required: true}
      label: {required: true}
      order: {required: true}
  RuntimeDashboardProductTrackingStateDefinition:
    slots: [id, state, label, order]
    slot_usage:
      state: {required: true}
      label: {required: true}
      order: {required: true}
  RuntimeDashboardUsageTruthState:
    slots: [id, active_stack_membership, inactive_stack_membership, tracked_product_presence, state]
    slot_usage:
      active_stack_membership: {required: true}
      inactive_stack_membership: {required: true}
      tracked_product_presence: {required: true}
      state: {required: true}
  RuntimeDashboardProductTrackingTruthState:
    slots: [id, tracked_product_presence, state]
    slot_usage:
      tracked_product_presence: {required: true}
      state: {required: true}
  RuntimeGroomingRankFieldPolicy:
    slots: [id, field, direction]
    slot_usage:
      field: {required: true, range: GroomingRankField}
      direction: {required: true, range: GroomingRankDirection}
  RuntimeGroomingPolicy:
    slots: [id, work_unit, eligibility, rank_fields, selection_count, relation_owner]
    slot_usage:
      id: {required: true}
      work_unit: {required: true, range: GroomingWorkUnit}
      eligibility: {required: true, multivalued: true, range: GroomingEligibility}
      rank_fields: {required: true, multivalued: true, inlined: true, inlined_as_list: true, range: RuntimeGroomingRankFieldPolicy}
      selection_count: {required: true}
      relation_owner: {required: true, range: GroomingRelationOwner}

slots:
  id: {identifier: true, required: true}
  operator: {required: true}
  operation: {range: ConstraintExecutionOperation}
  match_direction: {range: ConstraintExecutionMatchDirection}
  aggregation: {range: ConstraintExecutionAggregation}
  selector_resolution:
  blocks_slots: {range: boolean}
  scores_advisory: {range: boolean}
  score_delta: {range: integer}
  field:
  runtime_value:
  values: {multivalued: true}
  conditions: {multivalued: true, range: Condition, inlined: true, inlined_as_list: true}
  selector: {range: Selector, inlined: false}
  left: {range: Condition, inlined: true}
  right: {range: Condition, inlined: true}
  weight: {range: decimal}
  trace_key:
  condition: {range: Condition, inlined: true}
  key:
  slot_field:
  rank: {range: integer}
  result:
  source_kind:
  applies_to: {multivalued: true}
  minimum_cardinality: {range: integer}
  maximum_cardinality: {range: integer}
  source_kind_values: {multivalued: true, range: RuntimeSourceKindValuePolicy, inlined: true, inlined_as_list: true}
  constraint_execution_policies: {multivalued: true, range: RuntimeConstraintExecutionPolicy, inlined: true, inlined_as_list: true}
  effect_scoring: {range: RuntimeEffectScoringPolicy, inlined: true}
  aggregation_mode:
  objective_function:
  balance_penalty_expression:
  tie_break:
  prefer_with_policy: {range: RuntimePreferWithPolicy, inlined: true}
  effect_match_dimensions: {multivalued: true, range: RuntimeEffectMatchDimensionPolicy, inlined: true, inlined_as_list: true}
  warning_types: {multivalued: true, range: RuntimeWarningTypePolicy, inlined: true, inlined_as_list: true}
  warning_emitters: {multivalued: true, range: RuntimeWarningEmitterPolicy, inlined: true, inlined_as_list: true}
  warning_trait_actions: {multivalued: true, range: RuntimeWarningTraitActionPolicy, inlined: true, inlined_as_list: true}
  concern_catalog: {multivalued: true, range: RuntimeConcernCatalogEntry, inlined: true, inlined_as_list: true}
  relation_warning_rules: {multivalued: true, range: RuntimeRelationWarningRule, inlined: true, inlined_as_list: true}
  relation_presence_statuses: {multivalued: true, range: RuntimeRelationPresenceStatusPolicy, inlined: true, inlined_as_list: true}
  selector_form_capabilities: {multivalued: true, range: RuntimeSelectorFormCapability, inlined: true, inlined_as_list: true}
  dashboard_state_catalog: {range: RuntimeDashboardStateCatalog, inlined: true}
  runtime_projection: {multivalued: true, range: RuntimeProjectionDescriptor, inlined: true, inlined_as_list: true}
  assignment_axes: {multivalued: true, range: RuntimeAssignmentAxisPolicy, inlined: true, inlined_as_list: true}
  glue_contract: {range: RuntimeGlueContract, inlined: true}
  engine_contract: {range: RuntimeEngineContract, inlined: true}
  inactive_stack_name:
  source_kinds: {multivalued: true}
  source_kind_roles: {multivalued: true}
  relation_warning_filter_fields: {multivalued: true, range: RelationWarningFilterField}
  relation_warning_active_sides: {multivalued: true, range: RelationWarningActiveSide}
  relation_presence_active_sides: {multivalued: true}
  relation_presence_truth_table: {multivalued: true, range: RuntimeRelationPresenceTruthState}
  relation_endpoint_selector_kinds: {multivalued: true}
  relation_selector_forms: {multivalued: true}
  warning_emitter_ids: {multivalued: true}
  prefer_with_source_fields: {multivalued: true}
  prefer_with_target_resolutions: {multivalued: true}
  prefer_with_pair_modes: {multivalued: true}
  protocol_version:
  result_mode:
  semantics: {multivalued: true, range: RuntimeEngineSemantic, inlined: true, inlined_as_list: true}
  conformance_scenarios: {multivalued: true, range: RuntimeEngineConformanceScenario, inlined: true, inlined_as_list: true}
  category:
  rule:
  source_of_truth:
  semantic:
  fixture:
  expected:
  grooming_policy: {range: RuntimeGroomingPolicy, inlined: true}
  work_unit: {range: GroomingWorkUnit}
  eligibility: {multivalued: true, range: GroomingEligibility}
  rank_fields: {multivalued: true, range: RuntimeGroomingRankFieldPolicy, inlined: true, inlined_as_list: true}
  relation_owner: {range: GroomingRelationOwner}
  direction: {range: GroomingRankDirection}
  selection_count: {range: integer}
  target:
  source:
  children: {multivalued: true, range: RuntimeProjectionDescriptor, inlined: true, inlined_as_list: true}
  executable: {range: boolean}
  assignment_source:
  assignment_field:
  order: {range: integer}
  scores: {multivalued: true, range: RuntimeEffectScore, inlined: true, inlined_as_list: true}
  level:
  score: {range: integer}
  balance_weight: {range: decimal, minimum_value: 0}
  prefer_with_bonus: {range: integer, minimum_value: 0}
  source_field:
  target_resolution:
  pair_mode:
  value_type:
  slot_near_values: {multivalued: true}
  near:
  model:
  warning_type:
  emitter:
  default_message:
  label:
  trait_id:
  action_text:
  relation_kind:
  filter_field:
  filter_value:
  active_side:
  reverse_output: {range: boolean}
  status:
  source_active: {range: boolean}
  target_active: {range: boolean}
  selector_kind:
  selector_form:
  endpoint_kind:
  show_match_details: {range: boolean}
  usage_states: {multivalued: true, range: RuntimeDashboardUsageStateDefinition, inlined: true, inlined_as_list: true}
  product_tracking_states: {multivalued: true, range: RuntimeDashboardProductTrackingStateDefinition, inlined: true, inlined_as_list: true}
  usage_truth_table: {multivalued: true, range: RuntimeDashboardUsageTruthState, inlined: true, inlined_as_list: true}
  product_tracking_truth_table: {multivalued: true, range: RuntimeDashboardProductTrackingTruthState, inlined: true, inlined_as_list: true}
  state:
  active_stack_membership: {range: boolean}
  inactive_stack_membership: {range: boolean}
  tracked_product_presence: {range: boolean}
