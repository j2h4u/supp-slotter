id: runtime_policy
engine_contract:
  id: planner_engine_contract
  protocol_version: supp-slotter.engine-contract/v2
  result_mode: exact_assignment
  pressure_identity: [item_id, dimension, value]
  domain_feasibility: unbounded_logical_domain
  primary_objective: maximize_unique_pressure_satisfaction
  secondary_objective: minimize_integer_squared_load_per_domain
  tie_break: stable_item_id_then_(slot.order,slot_id)
  publication_statuses: [Optimal, Indeterminate]
  semantics:
    - id: selector_resolution
      category: selectors
      rule: "entity_id resolves one stable card; name resolves all exact-name cards; term resolves all cards carrying the canonical term; empty and unsupported outcomes remain distinct; exact_form requires an entity_id and is required when same-name siblings exist."
      source_of_truth: ontology/scheduling-model.yaml + ontology/vocabulary.yaml + verified substance cards
    - id: stack_partition
      category: stack_state
      rule: "normalize each product into one authored partition; only declared routable daily/training partitions enter planning, while declared inactive and tracked-unassigned ownership partitions are excluded; absent membership is unassigned."
      source_of_truth: data/stacks.yaml + ontology/runtime-policy.yaml
    - id: episodic_presentation
      category: presentation
      rule: "use_pattern not_every_day remains in the daily scheduling stack and changes presentation grouping only; it does not define recurrence, dosage, or calendar semantics."
      source_of_truth: ProductCard.use_pattern + data/products
    - id: candidate_feasibility
      category: search_inputs
      rule: "each selected item is feasible in every slot belonging to its unbounded logical domain; no capacity, pair condition, numerical ranking, or physical-fit condition narrows the domain."
      source_of_truth: pillbox slots + data/stacks.yaml + ontology/runtime-policy.yaml
    - id: canonical_objective_and_tie_break
      category: optimization
      rule: "maximize unique pressure identities; then minimize the exact integer sum of squared loads independently within each unbounded domain; then minimize the assignment tuple ordered by stable item ID and (slot.order, slot_id)."
      source_of_truth: ontology/runtime-policy.yaml
    - id: publication_boundary
      category: publication
      rule: "publish only Optimal results proved globally; conflicts, invalid inputs, interruption, timeout, or resource exhaustion are layout-free Indeterminate results."
      source_of_truth: ontology/runtime-policy.yaml + canonical optimizer
glue_contract:
  id: planner_glue_contract
  inactive_stack_name: inactive
  stack_partition:
    id: planner_stack_partition
    routable_stack_names: [daily, training]
    excluded_stack_names: [inactive]
    tracked_unassigned_partition_name: tracked_unassigned
  relation_endpoint_selector_kinds: [entity, term]
  relation_selector_forms: [entity_id, name, term]
selector_form_capabilities:
  - id: selector_form_entity_id
    selector_form: entity_id
    endpoint_kind: entity
    show_match_details: false
  - id: selector_form_name
    selector_form: name
    endpoint_kind: entity
    show_match_details: true
  - id: selector_form_term
    selector_form: term
    endpoint_kind: term
    show_match_details: true

# Dashboard review states are a projection of facts, not a second handwritten
# classification in the renderer.  The tables cover every boolean input
# combination so an authored mapping edit is observable and fail-closed.
dashboard_state_catalog:
  usage_states:
    - {id: dashboard_usage_current, state: current, label: Current, order: 0}
    - {id: dashboard_usage_on_shelf, state: on_shelf, label: On shelf, order: 1}
    - {id: dashboard_usage_unassigned, state: unassigned, label: Unassigned, order: 2}
    - {id: dashboard_usage_not_current, state: not_current, label: Not current, order: 3}
  product_tracking_states:
    - {id: dashboard_tracking_tracked, state: tracked_product, label: Tracked product, order: 0}
    - {id: dashboard_tracking_none, state: no_tracked_product, label: No tracked product, order: 1}
  usage_truth_table:
    - {id: usage_false_false_false, active_stack_membership: false, inactive_stack_membership: false, tracked_product_presence: false, state: not_current}
    - {id: usage_false_false_true, active_stack_membership: false, inactive_stack_membership: false, tracked_product_presence: true, state: unassigned}
    - {id: usage_false_true_false, active_stack_membership: false, inactive_stack_membership: true, tracked_product_presence: false, state: on_shelf}
    - {id: usage_false_true_true, active_stack_membership: false, inactive_stack_membership: true, tracked_product_presence: true, state: on_shelf}
    - {id: usage_true_false_false, active_stack_membership: true, inactive_stack_membership: false, tracked_product_presence: false, state: current}
    - {id: usage_true_false_true, active_stack_membership: true, inactive_stack_membership: false, tracked_product_presence: true, state: current}
    - {id: usage_true_true_false, active_stack_membership: true, inactive_stack_membership: true, tracked_product_presence: false, state: current}
    - {id: usage_true_true_true, active_stack_membership: true, inactive_stack_membership: true, tracked_product_presence: true, state: current}
  product_tracking_truth_table:
    - {id: tracking_false, tracked_product_presence: false, state: no_tracked_product}
    - {id: tracking_true, tracked_product_presence: true, state: tracked_product}
