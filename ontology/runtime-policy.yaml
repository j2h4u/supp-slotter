id: runtime_policy
protocol:
  condition_classes: [Condition]
  action_classes: [Action]
  gate_classes: [LifecycleGate, PrecedenceRule, TableLookup]
  policy_class: RuntimePolicyCatalog
glue_contract:
  id: planner_glue_contract
  inactive_stack_name: inactive
  source_kinds: [component, product, substance]
  source_kind_roles: [assignment_source, authority_source, competition_source]
  scope_fact_adapters: [capability_scalar, capability_values, dimension_singleton, product_identity, source_formulation]
  component_authority_outcomes: [primary, secondary]
  component_authority_primary_values: ["false", "true", unset]
  relation_warning_filter_fields: [assertion_kind, semantic_family]
  relation_warning_active_sides: [both, source, target]
  relation_presence_active_sides: [both, none, source, target]
  relation_presence_truth_table:
    - {source_active: false, target_active: false}
    - {source_active: false, target_active: true}
    - {source_active: true, target_active: false}
    - {source_active: true, target_active: true}
  relation_review_status_ids: [actionable_now, active_pair_present, inactive, latent_one_side_present]
  relation_endpoint_selector_kinds: [entity, term]
  concern_membership_roles: [active, inactive, product_fallback, substance_fallback]
  active_concern_role: active
  inactive_concern_role: inactive
  product_concern_fallback_role: product_fallback
  substance_concern_fallback_role: substance_fallback
  warning_emitter_ids: [intra_product_constraint_conflict, prefer_with_resolver, trait_review_assignment]
  prefer_with_source_fields: [prefer_with]
  prefer_with_target_resolutions: [exactly_one_active_item]
  prefer_with_pair_modes: [undirected_same_slot_bonus]
fact_fields:
  - {id: fact_planner, field: planner, value_type: string}
  - {id: fact_food_model, field: food_model, value_type: string}
  - {id: fact_slot_model, field: slot_model, value_type: string}
  - {id: fact_intended_use, field: intended_use, value_type: string}
  - {id: fact_substrate, field: substrate, value_type: string}
  - {id: fact_product, field: product, value_type: string}
  - {id: fact_formulation, field: formulation, value_type: string}
  - {id: fact_requested_value, field: requested_value, value_type: string}
  - {id: fact_supported_value, field: supported_value, value_type: string}
  - {id: fact_supported_values, field: supported_values, value_type: strings}
  - {id: fact_source_kind, field: source_kind, value_type: string}
  - {id: fact_source_form, field: source_form, value_type: string}
  - {id: fact_scope_kind, field: scope_kind, value_type: string}
  - {id: fact_requested_product_id, field: requested_product_id, value_type: string}
  - {id: fact_actual_product_id, field: actual_product_id, value_type: string}
  - {id: fact_left_authority, field: left_authority, value_type: string}
  - {id: fact_right_authority, field: right_authority, value_type: string}
  - {id: fact_left_source_kind, field: left_source_kind, value_type: string}
  - {id: fact_right_source_kind, field: right_source_kind, value_type: string}
  - {id: fact_left_axis, field: left_axis, value_type: string}
  - {id: fact_right_axis, field: right_axis, value_type: string}
  - {id: fact_left_policy_id, field: left_policy_id, value_type: string}
  - {id: fact_right_policy_id, field: right_policy_id, value_type: string}
  - {id: fact_left_action, field: left_action, value_type: string}
  - {id: fact_right_action, field: right_action, value_type: string}
  - {id: fact_left_executable, field: left_executable, value_type: boolean}
  - {id: fact_right_executable, field: right_executable, value_type: boolean}
  - {id: fact_left_eligible, field: left_eligible, value_type: boolean}
  - {id: fact_right_eligible, field: right_eligible, value_type: boolean}
  - {id: fact_any_explicit_primary, field: any_explicit_primary, value_type: boolean}
  - {id: fact_component_primary, field: component_primary, value_type: string}
source_kind_values:
  - id: source_kind_product
    source_kind: product
    applies_to: [assignment_source, authority_source]
    description: Direct product-level assignment source.
  - id: source_kind_component
    source_kind: component
    applies_to: [authority_source]
    description: Product component authority source used while resolving assignment precedence.
  - id: source_kind_substance
    source_kind: substance
    applies_to: [assignment_source, competition_source]
    description: Substance-level assignment source.
effect_match_dimensions:
  - id: match_near
    key: near
    slot_field: near
    value_type: slot_near
  - id: match_food
    key: food
    slot_field: food
    value_type: boolean
assignment_axes:
  - {id: assignment_axis_intake, axis: intake, order: 0, assignment_source: schedule, assignment_field: intake}
  - {id: assignment_axis_timing, axis: timing, order: 1, assignment_source: schedule, assignment_field: timing}
  - {id: assignment_axis_activity, axis: activity, order: 2, assignment_source: schedule, assignment_field: activity}
assignment_actions:
  - {id: assignment_action_active, assignment_action: active, executable: true, shadowed: false}
  - {id: assignment_action_suppressed, assignment_action: suppressed, executable: false, shadowed: false}
  - {id: assignment_action_shadowed, assignment_action: shadowed, executable: false, shadowed: true}
lifecycle_policies:
  - id: approved
    state: approved
    rank: 3
    executable: true
  - id: review_pending
    state: review_pending
    rank: 2
    executable: true
  - id: retired
    state: retired
    rank: 0
    executable: false
execution_gates:
  - id: approved_execution
    lifecycle_state: approved
    evidence_requirement: required
    executable: true
  - id: review_pending_execution
    lifecycle_state: review_pending
    evidence_requirement: evidence_or_gap
    executable: true
  - id: retired_execution
    lifecycle_state: retired
    evidence_requirement: required
    executable: false
enforcement_policies:
  - id: none
    mode: none
    rank: 0
    executable: false
    effect_role: none
  - id: advisory
    mode: advisory
    rank: 1
    executable: true
    effect_role: warning
  - id: preference
    mode: preference
    rank: 2
    executable: true
    effect_role: scored
  - id: block
    mode: block
    rank: 3
    executable: true
    effect_role: blocking
scope_dimensions:
  - id: planner
    key: planner
    values: [slot_policy, audit]
    rule_ids: [scope_slot_policy]
    default_outcome: mismatch_scope
    fact_adapter: capability_scalar
    capability_field: planner
    allows_block_enforcement: true
  - id: food_model
    key: food_model
    values: [binary]
    rule_ids: [scope_binary_food]
    default_outcome: mismatch_scope
    fact_adapter: capability_scalar
    capability_field: food_model
    allows_block_enforcement: true
  - id: slot_model
    key: slot_model
    values: [binary, wake_day_sleep, workout_before_after, wake, breakfast, day_meal, sleep, workout_before, workout_after]
    rule_ids: [scope_supported_slot_model]
    default_outcome: mismatch_scope
    fact_adapter: capability_values
    capability_field: slot_models
    allows_block_enforcement: true
  - id: intended_use
    key: intended_use
    values: [digestive]
    rule_ids: [scope_general_use]
    default_outcome: mismatch_scope
    fact_adapter: dimension_singleton
    capability_field: values
    allows_block_enforcement: false
  - id: substrate
    key: substrate
    values: [lactose]
    rule_ids: [scope_human_substrate]
    default_outcome: mismatch_scope
    fact_adapter: dimension_singleton
    capability_field: values
    allows_block_enforcement: false
  - id: product
    key: product
    values: [direct]
    rule_ids: [scope_direct_product]
    default_outcome: mismatch_scope
    fact_adapter: product_identity
    capability_field: product_id
    allows_block_enforcement: true
  - id: formulation
    key: formulation
    values: [unknown, capsule, tablet, powder, liquid]
    rule_ids: [scope_unknown_formulation, scope_supported_formulation]
    default_outcome: mismatch_scope
    fact_adapter: source_formulation
    capability_field: formulations
    allows_block_enforcement: false
scope_rules:
  - id: scope_slot_policy
    priority: 10
    conditions: [{operator: equals_field, field: requested_value, value: supported_value}]
    outcome: matched_scope
  - id: scope_binary_food
    priority: 10
    conditions: [{operator: equals_field, field: requested_value, value: supported_value}]
    outcome: matched_scope
  - id: scope_supported_slot_model
    priority: 10
    conditions: [{operator: member_of_field, field: requested_value, value: supported_values}]
    outcome: matched_scope
  - id: scope_general_use
    priority: 10
    conditions: [{operator: equals_field, field: requested_value, value: supported_value}]
    outcome: limited_scope
  - id: scope_human_substrate
    priority: 10
    conditions: [{operator: equals_field, field: requested_value, value: supported_value}]
    outcome: limited_scope
  - id: scope_unknown_formulation
    priority: 20
    conditions: [{operator: equals, field: requested_value, value: unknown}]
    outcome: limited_scope
  - id: scope_direct_product
    priority: 10
    conditions:
      - {operator: equals, field: scope_kind, value: direct}
      - {operator: equals_field, field: requested_product_id, value: actual_product_id}
    outcome: matched_scope
  - id: scope_supported_formulation
    priority: 10
    conditions:
      - {operator: equals_field, field: requested_value, value: source_form}
      - {operator: member_of_field, field: requested_value, value: supported_values}
    outcome: matched_scope
authorities:
  - id: authority_product_direct
    priority: 30
    conditions: [{operator: equals, field: source_kind, value: product}]
    authority: product_direct
    enforcement_cap: block
    score_weight: 1
    control_rank: 3
    action_code: assign_product_direct
    reason_code: authority_product_direct
  - id: authority_component_primary
    priority: 20
    conditions:
      - {operator: equals, field: source_kind, value: component}
      - {operator: equals, field: source_form, value: primary}
    authority: component_primary
    enforcement_cap: block
    score_weight: 1
    control_rank: 2
    action_code: assign_component_primary
    reason_code: authority_component_primary
  - id: authority_component_secondary
    priority: 10
    conditions:
      - {operator: equals, field: source_kind, value: component}
      - {operator: equals, field: source_form, value: secondary}
    authority: component_secondary
    enforcement_cap: preference
    score_weight: 0.25
    control_rank: 1
    action_code: assign_component_secondary
    reason_code: authority_component_secondary
component_authority_rules:
  - id: component_no_explicit_true
    priority: 60
    conditions:
      - {operator: is_false, field: any_explicit_primary}
      - {operator: equals, field: component_primary, value: "true"}
    outcome: primary
  - id: component_no_explicit_false
    priority: 50
    conditions:
      - {operator: is_false, field: any_explicit_primary}
      - {operator: equals, field: component_primary, value: "false"}
    outcome: primary
  - id: component_no_explicit_unset
    priority: 40
    conditions:
      - {operator: is_false, field: any_explicit_primary}
      - {operator: equals, field: component_primary, value: "unset"}
    outcome: primary
  - id: component_explicit_true
    priority: 30
    conditions:
      - {operator: is_true, field: any_explicit_primary}
      - {operator: equals, field: component_primary, value: "true"}
    outcome: primary
  - id: component_explicit_false
    priority: 20
    conditions:
      - {operator: is_true, field: any_explicit_primary}
      - {operator: equals, field: component_primary, value: "false"}
    outcome: secondary
  - id: component_explicit_unset
    priority: 10
    conditions:
      - {operator: is_true, field: any_explicit_primary}
      - {operator: equals, field: component_primary, value: "unset"}
    outcome: secondary
competition_rules:
  - id: product_direct_over_substance_same_axis
    priority: 40
    conditions:
      - {operator: equals, field: left_authority, value: product_direct}
      - {operator: equals, field: right_source_kind, value: substance}
      - {operator: equals_field, field: left_axis, value: right_axis}
    action_code: left_wins
    reason_code: product_direct_defeats_substance_same_axis
  - id: substance_under_product_direct_same_axis
    priority: 30
    conditions:
      - {operator: equals, field: right_authority, value: product_direct}
      - {operator: equals, field: left_source_kind, value: substance}
      - {operator: equals_field, field: right_axis, value: left_axis}
    action_code: right_wins
    reason_code: product_direct_defeats_substance_same_axis
  - id: primary_over_secondary_same_policy_axis
    priority: 20
    conditions:
      - {operator: equals, field: left_authority, value: component_primary}
      - {operator: equals, field: right_authority, value: component_secondary}
      - {operator: equals_field, field: left_policy_id, value: right_policy_id}
      - {operator: equals_field, field: left_axis, value: right_axis}
      - {operator: equals, field: left_action, value: active}
      - {operator: is_true, field: left_executable}
      - {operator: is_true, field: left_eligible}
      - {operator: equals, field: right_action, value: active}
      - {operator: is_true, field: right_executable}
      - {operator: is_true, field: right_eligible}
    action_code: left_wins
    reason_code: component_primary_defeats_secondary_same_policy_axis
  - id: secondary_under_primary_same_policy_axis
    priority: 10
    conditions:
      - {operator: equals, field: right_authority, value: component_primary}
      - {operator: equals, field: left_authority, value: component_secondary}
      - {operator: equals_field, field: right_policy_id, value: left_policy_id}
      - {operator: equals_field, field: right_axis, value: left_axis}
      - {operator: equals, field: right_action, value: active}
      - {operator: is_true, field: right_executable}
      - {operator: is_true, field: right_eligible}
      - {operator: equals, field: left_action, value: active}
      - {operator: is_true, field: left_executable}
      - {operator: is_true, field: left_eligible}
    action_code: right_wins
    reason_code: component_primary_defeats_secondary_same_policy_axis
  - id: unrelated_assignments
    priority: 0
    conditions: []
    action_code: no_action
    reason_code: unrelated_assignments_no_action
enforcement_projection:
  - {id: enforcement_none_role, mode: none, effect_role: none}
  - {id: enforcement_advisory_role, mode: advisory, effect_role: warning}
  - {id: enforcement_preference_role, mode: preference, effect_role: scored}
  - {id: enforcement_block_role, mode: block, effect_role: blocking}
effect_remaps:
  - {id: remap_none_block_only, mode: none, level: null, projected_level: null, score_enabled: false, block_behavior: suppress, level_code: level_suppressed, block_code: block_suppressed, default_code: effect_suppressed}
  - {id: remap_none_prefer_strong, mode: none, level: prefer_strong, projected_level: null, score_enabled: false, block_behavior: suppress, level_code: level_suppressed, block_code: block_suppressed, default_code: effect_suppressed}
  - {id: remap_none_prefer, mode: none, level: prefer, projected_level: null, score_enabled: false, block_behavior: suppress, level_code: level_suppressed, block_code: block_suppressed, default_code: effect_suppressed}
  - {id: remap_none_avoid, mode: none, level: avoid, projected_level: null, score_enabled: false, block_behavior: suppress, level_code: level_suppressed, block_code: block_suppressed, default_code: effect_suppressed}
  - {id: remap_none_avoid_strong, mode: none, level: avoid_strong, projected_level: null, score_enabled: false, block_behavior: suppress, level_code: level_suppressed, block_code: block_suppressed, default_code: effect_suppressed}
  - {id: remap_advisory_block_only, mode: advisory, level: null, projected_level: null, score_enabled: false, block_behavior: suppress, level_code: level_suppressed, block_code: block_suppressed, default_code: advisory_effect}
  - {id: remap_advisory_prefer_strong, mode: advisory, level: prefer_strong, projected_level: null, score_enabled: false, block_behavior: suppress, level_code: level_suppressed, block_code: block_suppressed, default_code: advisory_effect}
  - {id: remap_advisory_prefer, mode: advisory, level: prefer, projected_level: null, score_enabled: false, block_behavior: suppress, level_code: level_suppressed, block_code: block_suppressed, default_code: advisory_effect}
  - {id: remap_advisory_avoid, mode: advisory, level: avoid, projected_level: null, score_enabled: false, block_behavior: suppress, level_code: level_suppressed, block_code: block_suppressed, default_code: advisory_effect}
  - {id: remap_advisory_avoid_strong, mode: advisory, level: avoid_strong, projected_level: null, score_enabled: false, block_behavior: suppress, level_code: level_suppressed, block_code: block_suppressed, default_code: advisory_effect}
  - {id: remap_preference_block_only, mode: preference, level: null, projected_level: null, score_enabled: false, block_behavior: suppress, level_code: level_suppressed, block_code: block_suppressed, default_code: scored_effect}
  - {id: remap_preference_prefer_strong, mode: preference, level: prefer_strong, projected_level: prefer, score_enabled: true, block_behavior: suppress, level_code: level_downgraded, block_code: block_suppressed, default_code: scored_effect}
  - {id: remap_preference_prefer, mode: preference, level: prefer, projected_level: prefer, score_enabled: true, block_behavior: suppress, level_code: level_preserved, block_code: block_suppressed, default_code: scored_effect}
  - {id: remap_preference_avoid, mode: preference, level: avoid, projected_level: avoid, score_enabled: true, block_behavior: suppress, level_code: level_preserved, block_code: block_suppressed, default_code: scored_effect}
  - {id: remap_preference_avoid_strong, mode: preference, level: avoid_strong, projected_level: avoid, score_enabled: true, block_behavior: suppress, level_code: level_downgraded, block_code: block_suppressed, default_code: scored_effect}
  - {id: remap_block_block_only, mode: block, level: null, projected_level: null, score_enabled: false, block_behavior: preserve, level_code: level_preserved, block_code: block_preserved, default_code: blocking_effect}
  - {id: remap_block_prefer_strong, mode: block, level: prefer_strong, projected_level: prefer_strong, score_enabled: true, block_behavior: preserve, level_code: level_preserved, block_code: block_preserved, default_code: blocking_effect}
  - {id: remap_block_prefer, mode: block, level: prefer, projected_level: prefer, score_enabled: true, block_behavior: preserve, level_code: level_preserved, block_code: block_preserved, default_code: blocking_effect}
  - {id: remap_block_avoid, mode: block, level: avoid, projected_level: avoid, score_enabled: true, block_behavior: preserve, level_code: level_preserved, block_code: block_preserved, default_code: blocking_effect}
  - {id: remap_block_avoid_strong, mode: block, level: avoid_strong, projected_level: avoid_strong, score_enabled: true, block_behavior: preserve, level_code: level_preserved, block_code: block_preserved, default_code: blocking_effect}
effect_remap_profiles:
  - {id: suppressed_without_score, modes: [none, advisory], score_enabled: false, block_behavior: suppress}
  - {id: suppressed_with_score, modes: [preference], score_enabled: true, block_behavior: suppress}
  - {id: preserved_with_score, modes: [block], score_enabled: true, block_behavior: preserve}
scope_outcomes:
  - id: matched_scope
    outcome: matched
    rank: 2
    direct_product: required
    formulation: exact_or_unknown
    scope_action: retain_enforcement
    enforcement_cap: block
  - id: limited_scope
    outcome: limited
    rank: 1
    direct_product: required
    formulation: unknown_or_supported
    scope_action: cap_to_preference
    enforcement_cap: preference
  - id: mismatch_scope
    outcome: mismatch
    rank: 0
    direct_product: required
    formulation: unsupported
    scope_action: suppress_assignment
    enforcement_cap: none
constraint_governance:
  id: constraint_governance
  evidence_format:
    id: constraint_evidence_format
    scheme: https
    require_host: true
    forbid_userinfo: true
  lifecycle_states:
    - id: proposed
      state: proposed
      rank: 1
      executable: false
    - id: review_pending
      state: review_pending
      rank: 2
      executable: true
    - id: approved
      state: approved
      rank: 3
      executable: true
    - id: retired
      state: retired
      rank: 0
      executable: false
  enforcement_modes:
    - id: constraint_review
      mode: review
      rank: 0
      executable: false
      effect_role: none
    - id: constraint_advisory
      mode: advisory
      rank: 1
      executable: true
      effect_role: warning
    - id: constraint_block
      mode: block
      rank: 2
      executable: true
      effect_role: blocking
  execution_gates:
    - id: constraint_proposed_execution
      lifecycle_state: proposed
      evidence_requirement: prohibited
      executable: false
    - id: constraint_review_pending_execution
      lifecycle_state: review_pending
      evidence_requirement: evidence_or_gap
      executable: true
    - id: constraint_approved_execution
      lifecycle_state: approved
      evidence_requirement: required
      executable: true
    - id: constraint_retired_execution
      lifecycle_state: retired
      evidence_requirement: required
      executable: false
  allowed_pairs:
    - id: proposed_review
      lifecycle_state: proposed
      enforcement_mode: review
    - id: review_pending_review
      lifecycle_state: review_pending
      enforcement_mode: review
    - id: approved_review
      lifecycle_state: approved
      enforcement_mode: review
    - id: approved_advisory
      lifecycle_state: approved
      enforcement_mode: advisory
    - id: approved_block
      lifecycle_state: approved
      enforcement_mode: block
    - id: retired_review
      lifecycle_state: retired
      enforcement_mode: review
  execution_policies:
    - id: separate_products_same_slot
      operation: separate_products_same_slot
      match_direction: symmetric
      aggregation: distinct_constraint
      selector_resolution: require_nonempty
      blocks_slots: true
      scores_advisory: true
      score_delta: -1
assignment_governance:
  id: assignment_governance
  required: true
  required_fields: [status, enforcement_cap, scope, evidence, owner, review_by]
  secondary_enforcement_cap: preference
effect_scoring:
  id: effect_scoring
  scores:
    - id: prefer_strong
      level: prefer_strong
      score: 4
    - id: prefer
      level: prefer
      score: 2
    - id: avoid
      level: avoid
      score: -2
    - id: avoid_strong
      level: avoid_strong
      score: -4
  balance_weight: 0.5
  prefer_with_bonus: 3
  advisory_constraint_score_delta: -1
  advisory_match_direction: symmetric
prefer_with_policy:
  id: prefer_with_policy
  source_field: prefer_with
  target_resolution: exactly_one_active_item
  pair_mode: undirected_same_slot_bonus
degradation_rules:
  - {id: approved_none, lifecycle_state: approved, incoming_mode: none, effective_mode: none}
  - {id: approved_advisory, lifecycle_state: approved, incoming_mode: advisory, effective_mode: advisory}
  - {id: approved_preference, lifecycle_state: approved, incoming_mode: preference, effective_mode: preference}
  - {id: approved_block, lifecycle_state: approved, incoming_mode: block, effective_mode: block}
  - {id: review_pending_none, lifecycle_state: review_pending, incoming_mode: none, effective_mode: none}
  - {id: review_pending_advisory, lifecycle_state: review_pending, incoming_mode: advisory, effective_mode: advisory}
  - {id: review_pending_preference, lifecycle_state: review_pending, incoming_mode: preference, effective_mode: advisory}
  - {id: review_pending_block, lifecycle_state: review_pending, incoming_mode: block, effective_mode: advisory}
  - {id: retired_none, lifecycle_state: retired, incoming_mode: none, effective_mode: none}
  - {id: retired_advisory, lifecycle_state: retired, incoming_mode: advisory, effective_mode: none}
  - {id: retired_preference, lifecycle_state: retired, incoming_mode: preference, effective_mode: none}
  - {id: retired_block, lifecycle_state: retired, incoming_mode: block, effective_mode: none}
constraint_precedence:
  - id: constraint_block
    key: block
    rank: 3
  - id: constraint_preference
    key: preference
    rank: 2
  - id: constraint_advisory
    key: advisory
    rank: 1
  - id: constraint_none
    key: none
    rank: 0
capability_rules:
  - id: slot_planner_binary
    planner: slot_policy
    food_model: binary
    base_slot_models: [binary]
    slot_models: [binary, wake_day_sleep, workout_before_after]
    product_scope: [direct]
    formulations: [unknown, capsule, tablet, powder, liquid]
    near_to_model:
      - id: wake_near_model
        near: wake
        model: wake_day_sleep
      - id: breakfast_near_model
        near: breakfast
        model: wake_day_sleep
      - id: day_meal_near_model
        near: day_meal
        model: wake_day_sleep
      - id: sleep_near_model
        near: sleep
        model: wake_day_sleep
      - id: workout_before_near_model
        near: workout_before
        model: workout_before_after
      - id: workout_after_near_model
        near: workout_after
        model: workout_before_after
warning_types:
  - id: warning_safety_concern
    warning_type: safety_concern
    label: Safety concern
    action_text: Review this safety concern before treating the schedule as final.
  - id: warning_intra_product_scheduling_constraint_conflict
    warning_type: intra_product_scheduling_constraint_conflict
    label: Component conflict inside one product
    action_text: Review this product manually; competing components are inside one physical product and cannot be separated by scheduling.
  - id: warning_ambiguous_prefer_with
    warning_type: ambiguous_prefer_with
    label: Companion product is ambiguous
    action_text: Choose the intended companion product before relying on co-location.
  - id: warning_trait_review
    warning_type: trait_review
    label: Trait review
    action_text: Review this ontology trait before treating the schedule as final.
  - id: warning_missing_balance_substance
    warning_type: missing_balance_substance
    label: Missing balancing substance
    action_text: Review whether the paired balancing substance should be present in the active stack.
  - id: warning_missing_support_substance
    warning_type: missing_support_substance
    label: Missing supporting substance
    action_text: Review whether adding the supporting substance would improve this target in the active stack.
  - id: warning_review_with_substance_present
    warning_type: review_with_substance_present
    label: Active review pairing
    action_text: Review this active pairing; the planner surfaces it for operator review and does not separate it by slot.
warning_emitters:
  - id: warning_emitter_prefer_with_resolver
    emitter: prefer_with_resolver
    warning_type: ambiguous_prefer_with
    default_message: prefer_with target maps to multiple active stack items; no bonus awarded
  - id: warning_emitter_intra_product_constraint_conflict
    emitter: intra_product_constraint_conflict
    warning_type: intra_product_scheduling_constraint_conflict
    default_message: Scheduling constraint applies inside one physical product; scheduling keeps the product together and emits this warning.
  - id: warning_emitter_trait_review_assignment
    emitter: trait_review_assignment
    warning_type: trait_review
    default_message: Manual review required.
warning_trait_actions:
  - id: warning_trait_manual_review
    trait_id: risk:manual_review
    action_text: Review this substance/product context manually before treating the schedule as final.
  - id: warning_trait_narrow_therapeutic_window
    trait_id: risk:narrow_therapeutic_window
    action_text: Review total daily amount across products and avoid accidental stacking.
  - id: warning_trait_hyperkalemia_med_interaction
    trait_id: risk:hyperkalemia_med_interaction
    action_text: Review potassium-related medication context before using this stack.
concern_warning_rules:
  - id: concern_warning_safety
    concern_kind: safety
    warning_type: safety_concern
non_warning_concern_kinds:
  - id: concern_review_only_model_gap
    concern_kind: model_gap
    review_surface: review
    description: Model gap concerns are reviewer-visible metadata and do not emit planner warnings.
  - id: concern_review_only_data_quality
    concern_kind: data_quality
    review_surface: review
    description: Data quality concerns are reviewer-visible metadata and do not emit planner warnings.
concern_review_statuses:
  - id: concern_review_status_active
    status: active
    rank: 0
    membership_role: active
    description: card is active in a non-inactive stack
  - id: concern_review_status_inactive
    status: inactive
    rank: 1
    membership_role: inactive
    description: card is in the inactive stack
  - id: concern_review_status_tracked_unassigned
    status: tracked-unassigned
    rank: 2
    membership_role: product_fallback
    description: product card is tracked but outside all stacks
  - id: concern_review_status_knowledge_only
    status: knowledge-only
    rank: 3
    membership_role: substance_fallback
    description: substance card is known but not assigned through an active product
relation_warning_rules:
  - id: relation_warning_review_with_present
    relation_kind: review_with
    warning_type: review_with_substance_present
    review_status: actionable_now
    filter_field: assertion_kind
    filter_value: clinical_review_signal
    active_side: both
    reverse_output: false
  - id: relation_warning_missing_balance_forward
    relation_kind: balance
    warning_type: missing_balance_substance
    review_status: actionable_now
    filter_field: semantic_family
    filter_value: nutrient_balance_review_signal
    active_side: source
    reverse_output: false
  - id: relation_warning_missing_balance_reverse
    relation_kind: balance
    warning_type: missing_balance_substance
    review_status: actionable_now
    filter_field: semantic_family
    filter_value: nutrient_balance_review_signal
    active_side: target
    reverse_output: true
  - id: relation_warning_missing_support
    relation_kind: supports
    warning_type: missing_support_substance
    review_status: actionable_now
    filter_field: assertion_kind
    filter_value: ontology_assertion
    active_side: target
    reverse_output: false

relation_review_statuses:
  - id: relation_review_status_actionable_now
    status: actionable_now
    rank: 0
    description: relation semantics fire for the current stack
  - id: relation_review_status_active_pair_present
    status: active_pair_present
    rank: 1
    description: both endpoints active; no absence warning
  - id: relation_review_status_latent_one_side_present
    status: latent_one_side_present
    rank: 2
    description: one endpoint active; relation does not fire
  - id: relation_review_status_inactive
    status: inactive
    rank: 3
    description: both endpoints absent

relation_presence_statuses:
  - id: relation_presence_both_active
    status: both_active
    source_active: true
    target_active: true
    active_side: both
    default_review_status: active_pair_present
    description: both endpoints active
  - id: relation_presence_missing_target
    status: missing_target
    source_active: true
    target_active: false
    active_side: source
    default_review_status: latent_one_side_present
    description: source active, target absent
  - id: relation_presence_missing_source
    status: missing_source
    source_active: false
    target_active: true
    active_side: target
    default_review_status: latent_one_side_present
    description: target active, source absent
  - id: relation_presence_neither_active
    status: neither_active
    source_active: false
    target_active: false
    active_side: none
    default_review_status: inactive
    description: both endpoints absent

relation_endpoint_policies:
  - id: relation_endpoint_entity
    selector_kind: entity
    broad_endpoint: false
    show_match_details: false
    audit_member_limit: 0
    label: concrete endpoint
  - id: relation_endpoint_term
    selector_kind: term
    broad_endpoint: true
    show_match_details: true
    audit_member_limit: 5
    label: trait endpoint

