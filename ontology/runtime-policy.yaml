id: runtime_policy
glue_contract:
  id: planner_glue_contract
  inactive_stack_name: inactive
  source_kinds: [assignment]
  source_kind_roles: [assignment_source]
  relation_warning_filter_fields: [assertion_kind, semantic_family]
  relation_warning_active_sides: [both, source, target]
  relation_presence_active_sides: [both, none, source, target]
  relation_presence_truth_table:
    - {source_active: false, target_active: false}
    - {source_active: false, target_active: true}
    - {source_active: true, target_active: false}
    - {source_active: true, target_active: true}
  relation_endpoint_selector_kinds: [entity, term]
  relation_selector_forms: [entity_id, name, term]
  warning_emitter_ids: [intra_product_constraint_conflict, prefer_with_resolver, trait_review_assignment]
  prefer_with_source_fields: [prefer_with]
  prefer_with_target_resolutions: [exactly_one_active_item]
  prefer_with_pair_modes: [undirected_same_slot_bonus]
source_kind_values:
  - id: source_kind_assignment
    source_kind: assignment
    applies_to: [assignment_source]
effect_match_dimensions:
  - id: match_near
    key: near
    slot_field: near
    value_type: slot_near
  - id: match_food
    key: food
    slot_field: food
    value_type: boolean
assignment_axes:
  - {id: assignment_axis_intake, axis: intake, order: 0, assignment_source: schedule, assignment_field: intake, minimum_cardinality: 0, maximum_cardinality: 1}
  - {id: assignment_axis_timing, axis: timing, order: 1, assignment_source: schedule, assignment_field: timing, minimum_cardinality: 0, maximum_cardinality: 1}
  - {id: assignment_axis_activity, axis: activity, order: 2, assignment_source: schedule, assignment_field: activity, minimum_cardinality: 0, maximum_cardinality: 1}
constraint_execution_policies:
    - id: separate_products_same_slot
      operation: separate_products_same_slot
      match_direction: symmetric
      aggregation: distinct_constraint
      selector_resolution: require_nonempty
      blocks_slots: true
      scores_advisory: true
      score_delta: -1
effect_scoring:
  id: effect_scoring
  objective_function: slot_score_plus_prefer_with_minus_quadratic_balance_penalty
  balance_penalty_expression: balance_weight * sum(slot_count^2)
  tie_break: stable_slot_order
  scores:
    - id: prefer_strong
      level: prefer_strong
      score: 4
    - id: prefer
      level: prefer
      score: 2
    - id: avoid
      level: avoid
      score: -2
    - id: avoid_strong
      level: avoid_strong
      score: -4
  balance_weight: 0.5
  prefer_with_bonus: 3
prefer_with_policy:
  id: prefer_with_policy
  source_field: prefer_with
  target_resolution: exactly_one_active_item
  pair_mode: undirected_same_slot_bonus
slot_near_values: [wake, breakfast, day_meal, sleep, workout_before, workout_after]
warning_types:
  - id: warning_safety_concern
    warning_type: safety_concern
    label: Safety concern
    action_text: Review this safety concern before treating the schedule as final.
  - id: warning_intra_product_scheduling_constraint_conflict
    warning_type: intra_product_scheduling_constraint_conflict
    label: Component conflict inside one product
    action_text: Review this product manually; competing components are inside one physical product and cannot be separated by scheduling.
  - id: warning_ambiguous_prefer_with
    warning_type: ambiguous_prefer_with
    label: Companion product is ambiguous
    action_text: Choose the intended companion product before relying on co-location.
  - id: warning_trait_review
    warning_type: trait_review
    label: Trait review
    action_text: Review this ontology trait before treating the schedule as final.
  - id: warning_missing_balance_substance
    warning_type: missing_balance_substance
    label: Missing balancing substance
    action_text: Review whether the paired balancing substance should be present in the active stack.
  - id: warning_missing_support_substance
    warning_type: missing_support_substance
    label: Missing supporting substance
    action_text: Review whether adding the supporting substance would improve this target in the active stack.
  - id: warning_review_with_substance_present
    warning_type: review_with_substance_present
    label: Active review pairing
    action_text: Review this active pairing; the planner surfaces it for operator review and does not separate it by slot.
warning_emitters:
  - id: warning_emitter_prefer_with_resolver
    emitter: prefer_with_resolver
    warning_type: ambiguous_prefer_with
    default_message: prefer_with target maps to multiple active stack items; no bonus awarded
  - id: warning_emitter_intra_product_constraint_conflict
    emitter: intra_product_constraint_conflict
    warning_type: intra_product_scheduling_constraint_conflict
    default_message: Scheduling constraint applies inside one physical product; scheduling keeps the product together and emits this warning.
  - id: warning_emitter_trait_review_assignment
    emitter: trait_review_assignment
    warning_type: trait_review
    default_message: Manual review required.
warning_trait_actions:
  - id: warning_trait_manual_review
    trait_id: risk:manual_review
    action_text: Review this substance/product context manually before treating the schedule as final.
  - id: warning_trait_narrow_therapeutic_window
    trait_id: risk:narrow_therapeutic_window
    action_text: Review total daily amount across products and avoid accidental stacking.
  - id: warning_trait_hyperkalemia_med_interaction
    trait_id: risk:hyperkalemia_med_interaction
    action_text: Review potassium-related medication context before using this stack.
concern_catalog:
  - id: concern_warning_safety
    concern_kind: safety
    warning_type: safety_concern
relation_warning_rules:
  - id: relation_warning_review_with_present
    relation_kind: review_with
    warning_type: review_with_substance_present
    filter_field: assertion_kind
    filter_value: clinical_review_signal
    active_side: both
    reverse_output: false
  - id: relation_warning_missing_balance_forward
    relation_kind: balance
    warning_type: missing_balance_substance
    filter_field: semantic_family
    filter_value: nutrient_balance_review_signal
    active_side: source
    reverse_output: false
  - id: relation_warning_missing_balance_reverse
    relation_kind: balance
    warning_type: missing_balance_substance
    filter_field: semantic_family
    filter_value: nutrient_balance_review_signal
    active_side: target
    reverse_output: true
  - id: relation_warning_missing_support
    relation_kind: supports
    warning_type: missing_support_substance
    filter_field: assertion_kind
    filter_value: ontology_assertion
    active_side: target
    reverse_output: false

relation_presence_statuses:
  - id: relation_presence_both_active
    status: both_active
    source_active: true
    target_active: true
    description: both endpoints active
  - id: relation_presence_missing_target
    status: missing_target
    source_active: true
    target_active: false
    description: source active, target absent
  - id: relation_presence_missing_source
    status: missing_source
    source_active: false
    target_active: true
    description: target active, source absent
  - id: relation_presence_neither_active
    status: neither_active
    source_active: false
    target_active: false
    description: both endpoints absent

selector_form_capabilities:
  - id: selector_form_entity_id
    selector_form: entity_id
    endpoint_kind: entity
    show_match_details: false
  - id: selector_form_name
    selector_form: name
    endpoint_kind: entity
    show_match_details: true
  - id: selector_form_term
    selector_form: term
    endpoint_kind: term
    show_match_details: true

# Dashboard review states are a projection of facts, not a second handwritten
# classification in the renderer.  The tables cover every boolean input
# combination so an authored mapping edit is observable and fail-closed.
dashboard_state_catalog:
  usage_states:
    - {id: dashboard_usage_current, state: current, label: Current, order: 0}
    - {id: dashboard_usage_on_shelf, state: on_shelf, label: On shelf, order: 1}
    - {id: dashboard_usage_unassigned, state: unassigned, label: Unassigned, order: 2}
    - {id: dashboard_usage_not_current, state: not_current, label: Not current, order: 3}
  product_tracking_states:
    - {id: dashboard_tracking_tracked, state: tracked_product, label: Tracked product, order: 0}
    - {id: dashboard_tracking_none, state: no_tracked_product, label: No tracked product, order: 1}
  usage_truth_table:
    - {id: usage_false_false_false, active_stack_membership: false, inactive_stack_membership: false, tracked_product_presence: false, state: not_current}
    - {id: usage_false_false_true, active_stack_membership: false, inactive_stack_membership: false, tracked_product_presence: true, state: unassigned}
    - {id: usage_false_true_false, active_stack_membership: false, inactive_stack_membership: true, tracked_product_presence: false, state: on_shelf}
    - {id: usage_false_true_true, active_stack_membership: false, inactive_stack_membership: true, tracked_product_presence: true, state: on_shelf}
    - {id: usage_true_false_false, active_stack_membership: true, inactive_stack_membership: false, tracked_product_presence: false, state: current}
    - {id: usage_true_false_true, active_stack_membership: true, inactive_stack_membership: false, tracked_product_presence: true, state: current}
    - {id: usage_true_true_false, active_stack_membership: true, inactive_stack_membership: true, tracked_product_presence: false, state: current}
    - {id: usage_true_true_true, active_stack_membership: true, inactive_stack_membership: true, tracked_product_presence: true, state: current}
  product_tracking_truth_table:
    - {id: tracking_false, tracked_product_presence: false, state: no_tracked_product}
    - {id: tracking_true, tracked_product_presence: true, state: tracked_product}

# Declarative projection contract.  The compiler walks this descriptor tree;
# changing a source or target here changes the executable projection without
# duplicating policy-specific key lists in compiler code.
runtime_projection:
  - id: glue_contract
    target: glue_contract
    source: glue_contract
  - id: source_kind_values
    target: source_kind_values
    source: source_kind_values
  - id: effect_match_dimensions
    target: effect_match_dimensions
    source: effect_match_dimensions
  - id: assignment_axes
    target: assignment_axes
    source: assignment_axes
  - id: constraint_execution_policies
    target: constraint_execution_policies
    source: constraint_execution_policies
  - id: scoring_projection
    target: effect_scoring
    children:
      - id: scoring_id
        target: id
        source: effect_scoring.id
      - id: scoring_objective_function
        target: objective_function
        source: effect_scoring.objective_function
      - id: scoring_balance_penalty_expression
        target: balance_penalty_expression
        source: effect_scoring.balance_penalty_expression
      - id: scoring_tie_break
        target: tie_break
        source: effect_scoring.tie_break
      - id: scoring_prefer_with_bonus
        target: prefer_with_bonus
        source: effect_scoring.prefer_with_bonus
      - id: scoring_balance_weight
        target: balance_weight
        source: effect_scoring.balance_weight
      - id: effect_scores
        target: scores
        source: effect_scoring.scores
  - id: prefer_with_policy
    target: prefer_with_policy
    source: prefer_with_policy
  - id: slot_near_values
    target: slot_near_values
    source: slot_near_values
  - id: warning_types
    target: warning_types
    source: warning_types
  - id: warning_emitters
    target: warning_emitters
    source: warning_emitters
  - id: warning_trait_actions
    target: warning_trait_actions
    source: warning_trait_actions
  - id: concern_catalog
    target: concern_catalog
    source: concern_catalog
  - id: relation_warning_rules
    target: relation_warning_rules
    source: relation_warning_rules
  - id: relation_presence_statuses
    target: relation_presence_statuses
    source: relation_presence_statuses
  - id: dashboard_state_catalog
    target: dashboard_state_catalog
    children:
      - id: dashboard_usage_states
        target: usage_states
        source: dashboard_state_catalog.usage_states
      - id: dashboard_product_tracking_states
        target: product_tracking_states
        source: dashboard_state_catalog.product_tracking_states
      - id: dashboard_usage_truth_table
        target: usage_truth_table
        source: dashboard_state_catalog.usage_truth_table
      - id: dashboard_product_tracking_truth_table
        target: product_tracking_truth_table
        source: dashboard_state_catalog.product_tracking_truth_table
  - id: selector_form_capabilities
    target: selector_form_capabilities
    source: selector_form_capabilities
