ontology_assertions:
  rel_balance_001:
    id: rel_balance_001
    relation_type: balance
    assertion_kind: clinical_review_signal
    semantic_family: nutrient_balance_review_signal
    source_selector:
      entity:
        name: Zinc
    target_selector:
      entity:
        name: Copper
    reason: Sustained high zinc exposure can lower copper status; this is a chronic
      balance-review signal, not evidence for acute co-dose harm or same-product separation.
    action: Review zinc/copper balance for sustained high-zinc exposure; do not split
      the same product or apply a universal zinc-copper interval.
    severity: medium
    research_state: supported
    sources:
    - https://ods.od.nih.gov/factsheets/zinc-healthprofessional/
    - https://ods.od.nih.gov/factsheets/Copper-HealthProfessional/
  rel_balance_002:
    id: rel_balance_002
    relation_type: balance
    assertion_kind: clinical_review_signal
    semantic_family: nutrient_balance_review_signal
    source_selector:
      entity:
        name: Vitamin B12
    target_selector:
      entity:
        name: Vitamin B9
    reason: Folate and B12 should be reviewed together for methylation/homocysteine
      context; methionine synthase requires both, and high folate can complicate B12-deficiency
      interpretation.
    action: Review folate and B12 status together; this is a clinical review signal,
      not a co-dose or separation rule.
    severity: medium
    research_state: supported
    sources:
    - https://ods.od.nih.gov/factsheets/VitaminB12-HealthProfessional/
    - https://ods.od.nih.gov/factsheets/Folate-HealthProfessional/
  rel_review_with_001:
    id: rel_review_with_001
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      category: effect
      term: nitric_oxide_support
    target_selector:
      category: effect
      term: pde5_inhibition
    reason: Convergence is mechanistic; no isolated controlled citrulline-PDE5 hemodynamic
      study establishes a clinical interaction, and this is not organic-nitrate equivalence.
    action: Surface for human review only; do not infer a contraindication or scheduling
      rule.
    severity: medium
    research_state: mechanistic_only
    sources:
    - https://pubmed.ncbi.nlm.nih.gov/17662090/
    - https://pubmed.ncbi.nlm.nih.gov/31889969/
    - https://pubmed.ncbi.nlm.nih.gov/39385595/
    - https://pubmed.ncbi.nlm.nih.gov/30150102/
    - https://pubmed.ncbi.nlm.nih.gov/38731094/
    - https://dailymed.nlm.nih.gov/dailymed/fdaDrugXsl.cfm?setid=78509a43-a907-4359-9022-f38c4f765880&type=display
    - https://dailymed.nlm.nih.gov/dailymed/lookup.cfm?setid=cdab7ef5-39cb-45cc-b2bf-5f634f2f5499
  rel_review_with_002:
    id: rel_review_with_002
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      entity:
        entity_id: sub_605u9zvqt2
    target_selector:
      entity:
        name: Vitamin B12
    reason: Metformin can reduce vitamin B12 absorption/status; review B12 context
      when metformin is active.
    action: Review B12 status and metformin exposure when metformin is active; no
      interval or scheduling penalty is established.
    severity: medium
    research_state: supported
    sources:
    - https://ods.od.nih.gov/factsheets/VitaminB12-HealthProfessional/
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC4069007/
    - https://pubmed.ncbi.nlm.nih.gov/28447237/
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC2874129/
  rel_review_with_003:
    id: rel_review_with_003
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      category: effect
      term: gastric_acid_suppressing_drug_context
    target_selector:
      entity:
        name: Vitamin B12
    reason: Gastric acid suppression can reduce absorption of food-bound vitamin B12;
      review B12 context when acid-suppressing medication is active.
    action: Review B12 status and duration of acid-suppressing medication exposure,
      distinguishing food-bound from crystalline supplemental B12; no separation rule
      is established.
    severity: medium
    research_state: supported
    sources:
    - https://ods.od.nih.gov/factsheets/VitaminB12-HealthProfessional/
    - https://pubmed.ncbi.nlm.nih.gov/37060552/
    - https://pubmed.ncbi.nlm.nih.gov/19262546/
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC9762528/
  rel_review_with_004:
    id: rel_review_with_004
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      entity:
        entity_id: sub_zqfp9n314s
    target_selector:
      entity:
        name: Vitamin B9
    reason: Methotrexate is a folate antagonist; review folate context when methotrexate
      is active.
    action: Review folate context with the prescribing clinician when methotrexate
      is active; no L-5-MTHF regimen, add/withhold, substitution, or scheduling rule
      is established.
    severity: high
    research_state: supported
    sources:
    - https://ods.od.nih.gov/factsheets/Folate-HealthProfessional/
    - https://pubmed.ncbi.nlm.nih.gov/18945303/
    - https://pubmed.ncbi.nlm.nih.gov/24737913/
  rel_review_with_005:
    id: rel_review_with_005
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      entity:
        entity_id: sub_tqihchk7rd
    target_selector:
      entity:
        name: Vitamin B9
    reason: Sulfasalazine can reduce folate absorption/status; review folate context
      when sulfasalazine is active.
    action: Review folate context when sulfasalazine is active; no folate requirement,
      dose, or scheduling rule is established.
    research_state: supported
    sources:
    - https://ods.od.nih.gov/factsheets/Folate-HealthProfessional/
  rel_review_with_006:
    id: rel_review_with_006
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      entity:
        name: Vitamin E
    target_selector:
      entity:
        name: Vitamin K1
    reason: High-dose vitamin E can antagonize vitamin K-dependent clotting factors;
      review together when vitamin E is active.
    severity: medium
  rel_review_with_007:
    id: rel_review_with_007
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      entity:
        name: Vitamin E
    target_selector:
      entity:
        name: Vitamin K2
    reason: High-dose vitamin E can antagonize vitamin K-dependent clotting factors;
      review together when vitamin E is active.
    severity: medium
  rel_review_with_008:
    id: rel_review_with_008
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      entity:
        entity_id: sub_31a1408cad
    target_selector:
      entity:
        name: Vitamin K1
    reason: Preformed vitamin A / retinol may reduce vitamin K cellular uptake/function;
      review together when both are active. This stays review_with-only because the
      practical separation advice is dose-dependent and the planner does not compute
      dose. Beta-carotene is intentionally excluded because it is provitamin A and
      not treated as preformed retinol exposure in this ontology.
    severity: medium
  rel_review_with_009:
    id: rel_review_with_009
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      entity:
        entity_id: sub_31a1408cad
    target_selector:
      entity:
        name: Vitamin K2
    reason: Preformed vitamin A / retinol may reduce vitamin K cellular uptake/function;
      review together when both are active. This stays review_with-only because the
      practical separation advice is dose-dependent and the planner does not compute
      dose. Beta-carotene is intentionally excluded because it is provitamin A and
      not treated as preformed retinol exposure in this ontology.
    severity: medium
  rel_review_with_010:
    id: rel_review_with_010
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      entity:
        entity_id: sub_45587454c0
    target_selector:
      entity:
        entity_id: sub_gjaf5119cu
    reason: Ginkgo can induce CYP metabolism and may reduce efavirenz exposure; review
      medication context.
    severity: medium
  rel_review_with_011:
    id: rel_review_with_011
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      entity:
        entity_id: sub_45587454c0
    target_selector:
      entity:
        entity_id: sub_ug92bkq5dh
    reason: Ginkgo can alter CYP3A substrate exposure; review medication context.
    severity: medium
  rel_review_with_012:
    id: rel_review_with_012
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      entity:
        entity_id: sub_a873e428ee
    target_selector:
      entity:
        entity_id: sub_7c38pzz3wa
    reason: Pyridoxine HCl can reduce levodopa effect by increasing aromatic amino-acid
      decarboxylation when levodopa is used without carbidopa or another peripheral
      decarboxylase inhibitor; carbidopa inhibits this peripheral conversion.
    action: Review the pyridoxine/levodopa pairing and whether carbidopa or another
      peripheral decarboxylase inhibitor is present; never infer that slot separation
      resolves this interaction.
    severity: high
    research_state: supported
    sources:
    - https://dailymed.nlm.nih.gov/dailymed/fdaDrugXsl.cfm?setid=a7e669fc-c011-4e51-85e6-b68d4e4738a8&type=display
  rel_review_with_013:
    id: rel_review_with_013
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      category: context
      term: incretin_drug_context
    target_selector:
      category: risk
      term: glucose_med_interaction
    reason: Incretin drugs affect glucose regulation; glucose-lowering supplement
      contexts can complicate glycemic monitoring or add hypoglycemia risk, especially
      when insulin or insulin secretagogues are also present.
    action: Review glycemic medications, fasting glucose/CGM pattern, hypoglycemia
      symptoms, and whether glucose-lowering supplements are still needed.
    severity: medium
  rel_review_with_014:
    id: rel_review_with_014
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      category: context
      term: incretin_drug_context
    target_selector:
      entity:
        entity_id: sub_605u9zvqt2
    reason: Metformin and GLP-1/GIP/incretin drugs are commonly combined clinically,
      but both can contribute to gastrointestinal intolerance and the combination
      changes glycemic interpretation.
    action: Review prescribing context, GI tolerance, hydration, B12 status, renal
      context, and glucose monitoring rather than treating the pair as independent.
    severity: low
  rel_review_with_015:
    id: rel_review_with_015
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      category: context
      term: incretin_drug_context
    target_selector:
      category: kind
      term: fiber
    reason: GLP-1/GIP/incretin drugs slow gastric emptying and commonly cause GI adverse
      effects; viscous or fermentable fibers can add bloating, constipation, satiety
      load, or oral-medication absorption complexity.
    action: Review fiber type, dose titration, water intake, constipation/bloating,
      and medication separation timing.
    severity: low
  rel_review_with_016:
    id: rel_review_with_016
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      entity:
        name: Calcium
    target_selector:
      entity:
        name: Iron
    reason: Calcium can reduce iron absorption in some acute, dose- and meal-dependent
      contexts, but human evidence is mixed and the planner does not represent elemental
      dose, iron form, or food composition.
    action: Review calcium and iron context together; prefer separate slots when feasible
      without treating co-presence as proof of harm or promising a fixed interval.
    severity: medium
    research_state: supported
    sources:
    - https://ods.od.nih.gov/factsheets/Iron%20%20-HealthProfessional/
    - https://pubmed.ncbi.nlm.nih.gov/1984334/
    - https://pubmed.ncbi.nlm.nih.gov/16155272/
    - https://pubmed.ncbi.nlm.nih.gov/24290597/
  rel_review_with_017:
    id: rel_review_with_017
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      entity:
        name: Calcium
    target_selector:
      entity:
        name: Zinc
    reason: Calcium reduced zinc absorption in some high-calcium/co-ingestion studies
      while ordinary-food studies did not; the signal is dose-, meal-, phytate-, salt-,
      and endpoint-dependent, and long-term relevance remains unresolved.
    action: Review calcium and zinc context together; prefer separate slots only when
      feasible for independently schedulable products, never split a combination or
      impose a universal interval.
    severity: medium
    research_state: supported
    sources:
    - https://pubmed.ncbi.nlm.nih.gov/8194505/
    - https://pubmed.ncbi.nlm.nih.gov/9174476/
    - https://pubmed.ncbi.nlm.nih.gov/19176739/
  rel_review_with_018:
    id: rel_review_with_018
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      entity:
        name: L-Lysine
    target_selector:
      entity:
        name: L-Arginine
    reason: L-lysine and L-arginine share cationic amino-acid transport, with human
      antagonism demonstrated at unusually high arginine exposure; routine supplement
      co-dosing effects are unproven.
    action: Review unusually high-dose lysine/arginine use; no automatic slot separation
      is justified by the current dose-blind planner.
    severity: low
    research_state: supported
    sources:
    - https://pubmed.ncbi.nlm.nih.gov/32187681/
    - https://pubmed.ncbi.nlm.nih.gov/14603368/
    - https://pubmed.ncbi.nlm.nih.gov/7690540/
  rel_review_with_019:
    id: rel_review_with_019
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      entity:
        name: Glycine
    target_selector:
      entity:
        name: Beta-alanine
    reason: Glycine and beta-alanine share transport and can interact at glycine-receptor
      systems in mechanistic preparations, but an ordinary-dose human supplement interaction
      is not established.
    action: Treat glycine/beta-alanine transport or receptor competition as low-confidence
      review knowledge; do not separate slots automatically.
    severity: low
    research_state: mechanistic_only
    sources:
    - https://pubmed.ncbi.nlm.nih.gov/7563025/
    - https://pubmed.ncbi.nlm.nih.gov/1915594/
    - https://pubmed.ncbi.nlm.nih.gov/7542038/
  rel_review_with_020:
    id: rel_review_with_020
    relation_type: review_with
    assertion_kind: clinical_review_signal
    semantic_family: clinical_review_signal
    source_selector:
      entity:
        name: Glycine
    target_selector:
      entity:
        name: Taurine
    reason: Glycine and taurine share some transport and receptor pharmacology in
      mechanistic preparations, but a practical human co-dose interaction is not established.
    action: Treat glycine/taurine transport or receptor competition as low-confidence
      review knowledge; do not separate slots automatically.
    severity: low
    research_state: mechanistic_only
    sources:
    - https://pubmed.ncbi.nlm.nih.gov/7563025/
