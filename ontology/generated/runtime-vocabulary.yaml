runtime_policy:
  id: runtime_policy
  engine_contract:
    id: planner_engine_contract
    protocol_version: supp-slotter.engine-contract/v1
    result_mode: exact_assignment
    semantics:
    - id: selector_resolution
      category: selectors
      rule: entity_id resolves one stable card; name resolves all exact-name cards;
        term resolves all cards carrying the canonical term; empty and unsupported
        outcomes remain distinct; exact_form requires an entity_id and is required
        when same-name siblings exist.
      source_of_truth: ontology/scheduling-model.yaml + ontology/vocabulary.yaml +
        verified substance cards
    - id: component_vote_aggregation
      category: schedule_projection
      rule: emit at most one assignment per component and axis; group rows by policy_id;
        group weight is row count; apply each matching effect once at that weight;
        round score*weight before summing; missing assertions contribute zero.
      source_of_truth: ontology/runtime-policy.yaml + substance schedule_assertions
    - id: stack_partition
      category: stack_state
      rule: normalize each product into one stack; only the configured inactive stack
        is excluded from planning; absent membership is unassigned; any other stack
        is active and selects slots from its matching pillbox.
      source_of_truth: data/stacks.yaml + ontology/runtime-policy.yaml
    - id: episodic_presentation
      category: presentation
      rule: use_pattern not_every_day remains in the daily scheduling stack and changes
        presentation grouping only; it does not define recurrence, dosage, or calendar
        semantics.
      source_of_truth: ProductCard.use_pattern + data/products
    - id: constraint_pair_evaluation
      category: constraints
      rule: evaluate operation pairs over product component IDs; symmetric matching
        checks both orientations; blocks_slots rejects a same-slot candidate; scores_advisory
        adds one score_delta per matched constraint and unordered product pair; intra-product
        matches warn because one product cannot be separated.
      source_of_truth: ontology/scheduling-constraints.yaml + ontology/runtime-policy.yaml
    - id: prefer_with_resolution
      category: preferences
      rule: resolve each target against active component items; zero targets award
        no pair; one target creates one unordered pair; multiple targets warn and
        award no pair; self-pairs are ignored; duplicate/reverse pairs collapse.
      source_of_truth: SubstanceCard.schedule.prefer_with + ontology/runtime-policy.yaml
    - id: candidate_feasibility
      category: search_inputs
      rule: initial candidates are slots whose stack equals the item stack; hard pair
        constraints are evaluated against already assigned slot items during search;
        item priority is fewest candidates, highest maximum base score, then source
        sequence.
      source_of_truth: pillbox slots + data/stacks.yaml + ontology/runtime-policy.yaml
    - id: objective_and_tie_break
      category: optimization
      rule: maximize slot_score + advisory_penalties + prefer_with_bonus - balance_weight*sum(slot_count^2);
        use stable slot order and lexicographic item assignment tuple for equal totals
        within the declared tolerance.
      source_of_truth: ontology/runtime-policy.yaml
    - id: relation_warning_truth
      category: warnings
      rule: active endpoint truth is intersection with components of products in non-inactive
        stacks; classify all four endpoint states; apply authored filters and active
        sides; preserve reverse output; deduplicate by endpoint/type key.
      source_of_truth: ontology/runtime-policy.yaml + relation assertion projection
    conformance_scenarios:
    - id: selector_exact_form
      semantic: selector_resolution
      fixture: selector_exact_form
      expected: one entity_id resolves one ID; an unscoped sibling collision fails
        closed
    - id: selector_empty_term
      semantic: selector_resolution
      fixture: selector_empty_term
      expected: known canonical term with no matching card returns empty
    - id: component_votes
      semantic: component_vote_aggregation
      fixture: component_votes
      expected: two components sharing one policy contribute weight two; unknown assertion
        contributes zero
    - id: stack_and_episodic
      semantic: stack_partition
      fixture: stack_and_episodic
      expected: inactive is excluded, absent membership is unassigned, daily not_every_day
        is presented separately
    - id: episodic_presentation
      semantic: episodic_presentation
      fixture: episodic_presentation
      expected: not_every_day remains in daily assignment and changes presentation
        grouping only
    - id: constraint_directions
      semantic: constraint_pair_evaluation
      fixture: constraint_directions
      expected: symmetric forward and reverse pairs match; same-product pair emits
        warning and does not split product
    - id: prefer_with_cardinality
      semantic: prefer_with_resolution
      fixture: prefer_with_cardinality
      expected: zero/one/many active targets produce no pair/pair/warning-without-bonus
    - id: candidate_priority
      semantic: candidate_feasibility
      fixture: candidate_priority
      expected: fewest candidates, then highest maximum score, then source order
    - id: objective_tie
      semantic: objective_and_tie_break
      fixture: objective_tie
      expected: higher total wins; equal total uses stable slot-order lexicographic
        tuple
    - id: relation_presence
      semantic: relation_warning_truth
      fixture: relation_presence
      expected: all four source/target active combinations map to declared statuses
        and warning sides
  glue_contract:
    id: planner_glue_contract
    inactive_stack_name: inactive
    source_kinds:
    - assignment
    source_kind_roles:
    - assignment_source
    relation_warning_filter_fields:
    - assertion_kind
    - semantic_family
    relation_warning_active_sides:
    - both
    - source
    - target
    relation_presence_active_sides:
    - both
    - none
    - source
    - target
    relation_presence_truth_table:
    - source_active: false
      target_active: false
    - source_active: false
      target_active: true
    - source_active: true
      target_active: false
    - source_active: true
      target_active: true
    relation_endpoint_selector_kinds:
    - entity
    - term
    relation_selector_forms:
    - entity_id
    - name
    - term
    warning_emitter_ids:
    - intra_product_constraint_conflict
    - prefer_with_resolver
    - trait_review_assignment
    prefer_with_source_fields:
    - prefer_with
    prefer_with_target_resolutions:
    - exactly_one_active_item
    prefer_with_pair_modes:
    - undirected_same_slot_bonus
  source_kind_values:
  - id: source_kind_assignment
    source_kind: assignment
    applies_to:
    - assignment_source
  effect_match_dimensions:
  - id: match_near
    key: near
    slot_field: near
    value_type: slot_near
  - id: match_food
    key: food
    slot_field: food
    value_type: boolean
  assignment_axes:
  - id: assignment_axis_intake
    axis: intake
    order: 0
    assignment_source: schedule
    assignment_field: intake
    minimum_cardinality: 0
    maximum_cardinality: 1
  - id: assignment_axis_timing
    axis: timing
    order: 1
    assignment_source: schedule
    assignment_field: timing
    minimum_cardinality: 0
    maximum_cardinality: 1
  - id: assignment_axis_activity
    axis: activity
    order: 2
    assignment_source: schedule
    assignment_field: activity
    minimum_cardinality: 0
    maximum_cardinality: 1
  constraint_execution_policies:
  - id: separate_products_same_slot
    operation: separate_products_same_slot
    match_direction: symmetric
    aggregation: distinct_constraint
    selector_resolution: require_nonempty
    blocks_slots: true
    scores_advisory: true
    score_delta: -1
  effect_scoring:
    id: effect_scoring
    aggregation_mode: sum_unique_component_assignments
    objective_function: slot_score_plus_prefer_with_minus_quadratic_balance_penalty
    balance_penalty_expression: balance_weight * sum(slot_count^2)
    tie_break: stable_slot_order
    scores:
    - id: prefer_strong
      level: prefer_strong
      score: 4
    - id: prefer
      level: prefer
      score: 2
    - id: avoid
      level: avoid
      score: -2
    - id: avoid_strong
      level: avoid_strong
      score: -4
    balance_weight: 0.5
    prefer_with_bonus: 3
  prefer_with_policy:
    id: prefer_with_policy
    source_field: prefer_with
    target_resolution: exactly_one_active_item
    pair_mode: undirected_same_slot_bonus
  slot_near_values:
  - wake
  - breakfast
  - day_meal
  - sleep
  - workout_before
  - workout_after
  warning_types:
  - id: warning_safety_concern
    warning_type: safety_concern
    label: Safety concern
    action_text: Review this safety concern before treating the schedule as final.
  - id: warning_intra_product_scheduling_constraint_conflict
    warning_type: intra_product_scheduling_constraint_conflict
    label: Component conflict inside one product
    action_text: Review this product manually; competing components are inside one
      physical product and cannot be separated by scheduling.
  - id: warning_ambiguous_prefer_with
    warning_type: ambiguous_prefer_with
    label: Companion product is ambiguous
    action_text: Choose the intended companion product before relying on co-location.
  - id: warning_trait_review
    warning_type: trait_review
    label: Trait review
    action_text: Review this ontology trait before treating the schedule as final.
  - id: warning_missing_balance_substance
    warning_type: missing_balance_substance
    label: Missing balancing substance
    action_text: Review whether the paired balancing substance should be present in
      the active stack.
  - id: warning_missing_support_substance
    warning_type: missing_support_substance
    label: Conditional support review
    action_text: Review whether this support relationship is applicable in context;
      absence from the tracked stack alone does not establish a need to add or supplement
      it.
  - id: warning_review_with_substance_present
    warning_type: review_with_substance_present
    label: Active review pairing
    action_text: Review this active pairing; the planner surfaces it for operator
      review and does not separate it by slot.
  warning_emitters:
  - id: warning_emitter_prefer_with_resolver
    emitter: prefer_with_resolver
    warning_type: ambiguous_prefer_with
    default_message: prefer_with target maps to multiple active stack items; no bonus
      awarded
  - id: warning_emitter_intra_product_constraint_conflict
    emitter: intra_product_constraint_conflict
    warning_type: intra_product_scheduling_constraint_conflict
    default_message: Scheduling constraint applies inside one physical product; scheduling
      keeps the product together and emits this warning.
  - id: warning_emitter_trait_review_assignment
    emitter: trait_review_assignment
    warning_type: trait_review
    default_message: Manual review required.
  warning_trait_actions:
  - id: warning_trait_manual_review
    trait_id: risk:manual_review
