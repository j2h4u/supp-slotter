ontology_assertions:
  rel_balance_001:
    id: rel_balance_001
    relation_type: balance
    assertion_kind: co_use_evidence
    semantic_family: nutrient_balance_context
    source_selector:
      entity:
        name: Zinc
    target_selector:
      entity:
        name: Copper
    reason: Sustained high zinc exposure can lower copper status; this is chronic
      nutrient-balance context only. It does not establish an acute co-dose effect,
      a same-product split, or a universal interval.
    research_state: supported
    sources:
    - https://ods.od.nih.gov/factsheets/zinc-healthprofessional/
    - https://ods.od.nih.gov/factsheets/Copper-HealthProfessional/
  rel_balance_002:
