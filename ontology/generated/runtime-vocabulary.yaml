scheduling_policies:
  activity:any_workout:
    term: any_workout
    label: Any workout slot
    description: Training-adjacent marker where pre/post timing is flexible.
    applies_when: Prefer either observable workout slot.
    effects:
    - match:
        near: workout_before
      level: prefer
    - match:
        near: workout_after
      level: prefer
    warning: false
  activity:post_workout:
    term: post_workout
    label: Post-workout
    description: Timing marker for substances intended after training.
    applies_when: Prefer the observable post-workout slot.
    effects:
    - match:
        near: workout_after
      level: prefer
    warning: false
  activity:pre_workout:
    term: pre_workout
    label: Pre-workout
    description: Timing marker for substances intended before training.
    applies_when: Prefer the observable pre-workout slot.
    effects:
    - match:
        near: workout_before
      level: prefer
    warning: false
  intake:empty_preferred:
    term: empty_preferred
    label: Prefers empty stomach
    description: Works or absorbs better away from food, without a hard food block.
    applies_when: Prefer a slot without food when feasible.
    effects:
    - match:
        food: false
      level: prefer
    - match:
        food: true
      level: avoid
    warning: false
  intake:fat_meal_required:
    term: fat_meal_required
    label: Requires fat-containing meal
    description: Fat-containing food is the real intake target; current slot model
      approximates this as food=true.
    applies_when: Prefer a slot with food as the current approximation of a fat-containing
      meal.
    effects:
    - match:
        food: true
      level: prefer_strong
    - match:
        food: false
      level: avoid
    warning: false
  intake:food_neutral:
    term: food_neutral
    label: Food neutral
    description: Food state is not a meaningful scheduling driver.
    applies_when: Food state does not drive slot assignment.
    effects: []
    warning: false
  intake:food_preferred:
    term: food_preferred
    label: Prefers food
    description: Food improves tolerance or practical use, but empty-stomach intake
      remains acceptable.
    applies_when: Prefer a slot with food when feasible.
    effects:
    - match:
        food: true
      level: prefer
    warning: false
  intake:food_required:
    term: food_required
    label: Requires food
    description: Active substance requires food for absorption, stomach tolerance,
      or reliable effect.
    applies_when: Prefer a slot with food; retain the soft preference when food is
      unavailable.
    effects:
    - match:
        food: true
      level: prefer_strong
    - match:
        food: false
      level: avoid
    warning: false
  risk:b6_neuropathy_long_term:
    term: b6_neuropathy_long_term
    label: B6 neuropathy long-term
    description: Long-term supplemental vitamin B6 exposure can cause sensory peripheral
      neuropathy; review cumulative supplemental B6 intake across forms and products
      and duration.
    applies_when: Use for supplemental vitamin B6 forms when long-term exposure warrants
      review across forms and products.
    effects: []
    warning: true
    action: Review cumulative supplemental B6 intake across all forms and products,
      plus duration.
  risk:biotin_lab_interference:
    term: biotin_lab_interference
    label: Biotin lab-test interference
    description: Supplemental biotin can interfere with biotin-streptavidin immunoassays,
      including thyroid, cardiac troponin, and other lab tests depending on assay
      design.
    applies_when: Use for supplemental biotin/B7 forms where lab-test interpretation
      should include a biotin-interference check.
    effects: []
    warning: true
    action: Ask about biotin before interpreting thyroid, troponin, or other immunoassay
      results; pause timing should follow the lab or clinician's guidance.
  risk:bleeding_med_interaction:
    term: bleeding_med_interaction
    label: Bleeding medication interaction
    description: Fibrinolytic, antiplatelet, anticoagulant, or omega-3 context where
      medication, surgery, or stacked bleeding-load review matters.
    applies_when: Use for nattokinase, high-signal omega-3 sources, antiplatelet botanicals,
      and other substances where anticoagulant/antiplatelet context should be reviewed.
    effects: []
    warning: true
  risk:cyp450_med_interaction:
    term: cyp450_med_interaction
    label: CYP450 medication interaction
    description: Botanical or supplement context where CYP induction/inhibition could
      change medication exposure.
    applies_when: Use when a substance has credible CYP interaction context, especially
      when product review should look for narrow-therapeutic-index or CNS medications.
    effects: []
    warning: true
    action: Review medication list for CYP-sensitive drugs before treating this as
      routine background support.
  risk:glucose_med_interaction:
    term: glucose_med_interaction
    label: Glucose medication interaction
    description: Insulin-sensitizing or glucose-lowering supplement context where
      insulin, metformin, or other antidiabetes medication should be reviewed for
      additive hypoglycemia risk.
    applies_when: Use for substances or supplement contexts where glucose-lowering,
      insulin-sensitizing, or insulin-mimetic effects make antidiabetes-medication
      review practical.
    effects: []
    warning: true
    action: Review antidiabetes medication context and hypoglycemia risk before treating
      this as routine background support.
  risk:hyperkalemia_med_interaction:
    term: hyperkalemia_med_interaction
    label: Hyperkalemia medication interaction
    description: Potassium-related medication interaction risk.
    applies_when: Use for potassium-containing substances or formulas where ACEi,
      ARB, NSAID, or K-sparing diuretic context matters.
    effects: []
    warning: true
  risk:hypotension_med_interaction:
    term: hypotension_med_interaction
    label: Hypotension medication interaction
    description: Vasodilator or blood-pressure-lowering context where nitrates, alpha-blockers,
      antihypertensives, PDE5 inhibitors, or symptomatic hypotension should be reviewed.
    applies_when: Use for PDE5 inhibitors, nitric-oxide precursors, and direct vasodilator
      substances where additive hypotension is the practical concern.
    effects: []
    warning: true
  risk:incretin_drug_medical_review:
    term: incretin_drug_medical_review
    label: Incretin drug medical review
    description: Prescription or investigational GLP-1/GIP/incretin-drug context where
      indication, contraindications, product quality, adverse effects, and drug-supplement
      interactions require medical review.
    applies_when: Use for semaglutide, tirzepatide, liraglutide, dulaglutide, exenatide,
      retatrutide, and similar incretin-mimetic drugs; do not use for ordinary glucose-support
      supplements.
    effects: []
    warning: true
    action: Review prescribing context, glycemic medications, GI tolerance, pancreatitis/gallbladder
      history, kidney dehydration risk, pregnancy planning, and product quality before
      any practical use discussion.
  risk:iron_overdose_review:
    term: iron_overdose_review
    label: Iron overdose review
    description: Supplemental iron has clinically important overdose and iron-overload
      review context, especially around children or hemochromatosis.
    applies_when: Use for iron supplement forms, regardless of source salt or chelate.
    effects: []
    warning: true
    action: Review iron indication, ferritin/iron status, hemochromatosis context,
      and child-safety storage before treating iron as routine background support.
  risk:liver_injury_review:
    term: liver_injury_review
    label: Liver-injury review
    description: Supplement context where rare liver injury has been reported and
      liver disease, symptoms, dose, extract potency, or empty-stomach use should
      be reviewed.
    applies_when: Use for concentrated botanical extracts with credible liver-injury
      reports, such as green tea extract, especially when extract potency is unknown.
    effects: []
    warning: true
    action: Review liver disease, symptoms, extract potency, dose, and food timing
      before treating this as routine background antioxidant support.
  risk:manual_review:
    term: manual_review
    label: Requires manual review
    description: Generic safety or interaction marker for items needing operator attention.
    applies_when: Use when no more specific practical risk trait exists yet.
    effects: []
    warning: true
  risk:narrow_therapeutic_window:
    term: narrow_therapeutic_window
    label: Narrow therapeutic window
    description: Nutrient or mineral where useful and excessive doses are close enough
      to require caution.
    applies_when: Use for selenium, copper, and similar narrow-window minerals.
    effects: []
    warning: true
  risk:retinol_accumulation_review:
    term: retinol_accumulation_review
    label: Retinol accumulation review
    description: Preformed vitamin A/retinol accumulates and has dose-dependent toxicity
      and pregnancy/teratogenicity review context.
    applies_when: Use for preformed vitamin A/retinol forms, not demand-regulated
      provitamin-A carotenoids.
    effects: []
    warning: true
    action: Review cumulative preformed vitamin A intake, liver context, and pregnancy
      relevance before treating retinol as routine background support.
  risk:seizure_threshold_review:
    term: seizure_threshold_review
    label: Seizure-threshold review
    description: Substance or botanical context where seizure history or medications
      that lower seizure threshold should be reviewed.
    applies_when: Use for substances where credible clinical references advise caution
      in people with seizure history or interacting seizure-threshold-lowering drugs.
    effects: []
    warning: true
  risk:serotonergic_med_interaction:
    term: serotonergic_med_interaction
    label: Serotonergic medication interaction
    description: Serotonin-precursor, serotonergic-modulating, SSRI/SNRI/MAOI, or
      stacked 5-HT context where medication or cumulative serotonergic-load review
      matters.
    applies_when: Use for 5-HTP and botanicals/adaptogens with documented or review-relevant
      serotonergic modulation where antidepressant or serotonin-syndrome-like context
      should be reviewed.
    effects: []
    warning: true
  risk:statin_like_monacolin_review:
    term: statin_like_monacolin_review
    label: Statin-like / monacolin review
    description: Red yeast rice context where monacolin K/lovastatin-like exposure,
      product variability, muscle/liver adverse effects, and statin-like drug interactions
      should be reviewed.
    applies_when: Use for red yeast rice products when monacolin content is unknown
      or when statin-like lipid-lowering activity is part of the intended rationale.
    effects: []
    warning: true
    action: Review monacolin/statin-like exposure, liver and muscle symptoms, and
      medication interaction context.
  risk:tmao_cardiometabolic_review:
    term: tmao_cardiometabolic_review
    label: TMAO cardiometabolic review
    description: Carnitine/choline-class gut-microbiome conversion context where TMAO
      production and cardiovascular risk profile should be reviewed without assuming
      direct harm from the substance alone.
    applies_when: Use for supplemental L-carnitine forms and related precursors when
      the reviewer should surface TMAO/cardiometabolic context.
    effects: []
    warning: true
  risk:vitamin_k_anticoagulant_review:
    term: vitamin_k_anticoagulant_review
    label: Vitamin K anticoagulant review
    description: Vitamin K intake affects vitamin-K-antagonist anticoagulant management;
      consistency matters more than avoidance.
    applies_when: Use for K1 and K2 forms where warfarin or related anticoagulant
      context should be reviewed.
    effects: []
    warning: true
    action: Review warfarin/vitamin-K-antagonist therapy and intake consistency before
      changing vitamin K exposure.
  risk:zinc_copper_balance_review:
    term: zinc_copper_balance_review
    label: Zinc-copper balance review
    description: Supplemental zinc can reduce copper status at higher or sustained
      intakes; review zinc and copper together.
    applies_when: Use for zinc supplement forms when cumulative zinc and copper balance
      should be surfaced.
    effects: []
    warning: true
    action: Review cumulative zinc intake and copper status/context for long-term
      use.
  timing:energy_like:
    term: energy_like
    label: Energy-like
    description: Direct wake-promoting or activating effect.
    applies_when: Prefer wake/day slots and avoid sleep when feasible.
    effects:
    - match:
        near: wake
      level: prefer
    - match:
        near: day_meal
      level: prefer
    - match:
        near: sleep
      level: avoid
    warning: false
  timing:sleep_disruptive:
    term: sleep_disruptive
    label: Sleep disruptive
    description: Likely to disrupt sleep and should not be placed near bedtime.
    applies_when: Avoid the observable sleep slot when feasible.
    effects:
    - match:
        near: sleep
      level: avoid
    warning: false
  timing:sleep_support:
    term: sleep_support
    label: Sleep support
    description: Directly supports sleep onset or sleep quality.
    applies_when: Prefer the observable sleep slot.
    effects:
    - match:
        near: sleep
      level: prefer
    warning: false
