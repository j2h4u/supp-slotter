runtime_policy:
  id: runtime_policy
  engine_contract:
    id: planner_engine_contract
    protocol_version: supp-slotter.engine-contract/v2
    result_mode: exact_assignment
    pressure_identity:
    - item_id
    - dimension
    - value
    domain_feasibility: unbounded_logical_domain
    primary_objective: maximize_unique_pressure_satisfaction
    secondary_objective: minimize_integer_squared_load_per_domain
    tie_break: stable_item_id_then_(slot.order,slot_id)
    publication_statuses:
    - Optimal
    - Indeterminate
    semantics:
    - id: selector_resolution
      category: selectors
      rule: entity_id resolves one stable card; name resolves all exact-name cards;
        term resolves all cards carrying the canonical term; empty and unsupported
        outcomes remain distinct; exact_form requires an entity_id and is required
        when same-name siblings exist.
      source_of_truth: ontology/scheduling-model.yaml + ontology/vocabulary.yaml +
        verified substance cards
    - id: stack_partition
      category: stack_state
      rule: normalize each product into one authored partition; only declared routable
        daily/training partitions enter planning, while declared inactive and tracked-unassigned
        ownership partitions are excluded; absent membership is unassigned.
      source_of_truth: data/stacks.yaml + ontology/runtime-policy.yaml
    - id: episodic_presentation
      category: presentation
      rule: use_pattern not_every_day remains in the daily scheduling stack and changes
        presentation grouping only; it does not define recurrence, dosage, or calendar
        semantics.
      source_of_truth: ProductCard.use_pattern + data/products
    - id: candidate_feasibility
      category: search_inputs
      rule: each selected item is feasible in every slot belonging to its unbounded
        logical domain; no capacity, pair condition, numerical ranking, or physical-fit
        condition narrows the domain.
      source_of_truth: pillbox slots + data/stacks.yaml + ontology/runtime-policy.yaml
    - id: canonical_objective_and_tie_break
      category: optimization
      rule: maximize unique pressure identities; then minimize the exact integer sum
        of squared loads independently within each unbounded domain; then minimize
        the assignment tuple ordered by stable item ID and (slot.order, slot_id).
      source_of_truth: ontology/runtime-policy.yaml
    - id: publication_boundary
      category: publication
      rule: publish only Optimal results proved globally; conflicts, invalid inputs,
        interruption, timeout, or resource exhaustion are layout-free Indeterminate
        results.
      source_of_truth: ontology/runtime-policy.yaml + canonical optimizer
