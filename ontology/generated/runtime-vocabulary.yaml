    semantic_family: nutrient_balance_context
    source_selector:
      entity:
        name: Vitamin B12
    target_selector:
      entity:
        name: Vitamin B9
    reason: Folate and B12 participate in methylation and homocysteine context; methionine
      synthase requires both, and high folate can complicate B12-deficiency interpretation.
      This is nutrient-balance context only and establishes no co-dose or timing rule.
    research_state: supported
    sources:
