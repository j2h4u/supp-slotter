    semantic_family: co_use_evidence
    source_selector:
      entity:
        name: Calcium
    target_selector:
      entity:
        name: Zinc
    reason: Calcium reduced zinc absorption in some high-calcium co-ingestion studies
      while ordinary-food studies did not; the signal is dose-, meal-, phytate-, salt-,
      and endpoint-dependent, and long-term relevance remains unresolved. No universal
      interval or scheduling conclusion is established.
    research_state: supported
    sources:
    - https://pubmed.ncbi.nlm.nih.gov/8194505/
    - https://pubmed.ncbi.nlm.nih.gov/9174476/
    - https://pubmed.ncbi.nlm.nih.gov/19176739/
