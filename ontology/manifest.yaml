schema_version: "2"
base_iri: https://j2h4u.github.io/supp-slotter/ontology/v1/
catalogs:
  - id: semantic_vocabulary
    role: vocabulary
    path: ontology/vocabulary.yaml
    root_class: VocabularyCatalog
  - id: ontoclean
    role: ontoclean
    path: ontology/ontoclean.yaml
    root_class: OntoCleanCatalog
  - id: relation_types
    role: relation_types
    path: ontology/relations.yaml
    root_class: RelationCatalog
  - id: assertions
    role: assertions
    path: data/relations.yaml
    root_class: RelationAssertionCatalog
  - id: runtime_policy
    role: runtime_policy
    path: ontology/runtime-policy.yaml
    root_class: RuntimePolicyCatalog
  - id: policies
    role: policies
    path: ontology/policies.yaml
    root_class: SchedulingPolicyCatalog
  - id: constraints
    role: constraints
    path: ontology/scheduling-constraints.yaml
    root_class: SchedulingConstraintCatalog
  - id: shapes
    role: custom_shapes
    path: ontology/constraints/semantic.ttl
    root_class: ShapesGraph
repository_projection:
  format_version: repository-projection-v1
  base_iri: https://j2h4u.github.io/supp-slotter/ontology/v1/
  sources:
    - id: substances
      locator:
        kind: flat_root
        path: data/substances
      root_class: Substance
    - id: products
      locator:
        kind: flat_root
        path: data/products
      root_class: Product
    - id: dashboards
      locator:
        kind: flat_root
        path: data/dashboards
      root_class: Dashboard
    - id: stacks
      locator:
        kind: explicit_path
        path: data/stacks.yaml
      root_class: Stack
    - id: pillboxes
      locator:
        kind: explicit_path
        path: data/pillboxes.yaml
      root_class: Pillbox
    - id: assertions
      locator:
        kind: catalog_ref
        catalog_id: assertions
  mappings:
    - source: substances
      root_class: Substance
      document_shape: mapping
      identity: {source: id, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/id}
      instructions:
        - {kind: slot, source: id, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/id}
        - {kind: alias, source: name, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/label}
        - {kind: slot, source: form, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/form}
        - {kind: sequence, source: "aliases[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/aliases}
        - {kind: slot, source: notes, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/notes}
        - {kind: inlined-node, source: "concerns[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/concerns, target: Concern}
        - {kind: slot, source: "concerns[].kind", subject: "concerns[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/concern_kind}
        - {kind: slot, source: "concerns[].text", subject: "concerns[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/concern_text}
        - {kind: inlined-node, source: "knowledge.<key>[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/knowledge_assertions, target: KnowledgeAssertion}
        - {kind: path-token, source: "knowledge.<key>[]", subject: "knowledge.<key>[]", token: "<key>[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/knowledge_category}
        - {kind: slot, source: "knowledge.<key>[]", subject: "knowledge.<key>[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/knowledge_value}
        - {kind: sequence, source: "schedule.prefer_with[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/prefer_with, target: Substance}
        - {kind: inlined-node, source: "schedule.intake[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_assertions, target: ScheduleAssertion}
        - {kind: path-token, source: "schedule.intake[]", subject: "schedule.intake[]", token: "intake[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_axis}
        - {kind: slot, source: "schedule.intake[]", subject: "schedule.intake[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_value}
        - {kind: inlined-node, source: "schedule.timing[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_assertions, target: ScheduleAssertion}
        - {kind: path-token, source: "schedule.timing[]", subject: "schedule.timing[]", token: "timing[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_axis}
        - {kind: slot, source: "schedule.timing[]", subject: "schedule.timing[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_value}
        - {kind: inlined-node, source: "schedule.activity[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_assertions, target: ScheduleAssertion}
        - {kind: path-token, source: "schedule.activity[]", subject: "schedule.activity[]", token: "activity[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_axis}
        - {kind: slot, source: "schedule.activity[]", subject: "schedule.activity[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_value}
        - {kind: inlined-node, source: "schedule_governance.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_governance_records, target: ScheduleGovernanceRecord}
        - {kind: path-token, source: "schedule_governance.<key>", subject: "schedule_governance.<key>", token: "<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/governance_policy}
        - {kind: slot, source: "schedule_governance.<key>.status", subject: "schedule_governance.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/governance_status}
        - {kind: slot, source: "schedule_governance.<key>.enforcement_cap", subject: "schedule_governance.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/enforcement_cap}
        - {kind: inlined-node, source: "schedule_governance.<key>.scope.<key>", subject: "schedule_governance.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/governance_scope, target: GovernanceScopeBinding}
        - {kind: path-token, source: "schedule_governance.<key>.scope.<key>", subject: "schedule_governance.<key>.scope.<key>", token: "<key>", token_index: 1, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/scope_axis}
        - {kind: slot, source: "schedule_governance.<key>.scope.<key>", subject: "schedule_governance.<key>.scope.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/scope_value}
        - {kind: inlined-node, source: "schedule_governance.<key>.evidence[]", subject: "schedule_governance.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/governance_evidence, target: ScheduleGovernanceEvidence}
        - {kind: slot, source: "schedule_governance.<key>.evidence[].source", subject: "schedule_governance.<key>.evidence[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/evidence_source_ref}
        - {kind: slot, source: "schedule_governance.<key>.evidence[].supports", subject: "schedule_governance.<key>.evidence[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/evidence_supports}
        - {kind: slot, source: "schedule_governance.<key>.evidence[].limitations", subject: "schedule_governance.<key>.evidence[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/evidence_limitations}
        - {kind: slot, source: schedule_governance.<key>.evidence_gap, subject: "schedule_governance.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/evidence_gap}
        - {kind: slot, source: schedule_governance.<key>.owner, subject: "schedule_governance.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/owner}
        - {kind: slot, source: schedule_governance.<key>.review_by, subject: "schedule_governance.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/review_by}
    - source: products
      root_class: Product
      document_shape: mapping
      identity: {source: id, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/id}
      instructions:
        - {kind: slot, source: id, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/id}
        - {kind: alias, source: name, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/label}
        - {kind: slot, source: brand, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/brand}
        - {kind: sequence, source: "urls[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/urls}
        - {kind: inlined-node, source: "components[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/components, target: ProductComponent}
        - {kind: reference, source: "components[].substance", subject: "components[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/substance, target: Substance}
        - {kind: slot, source: "components[].amount", subject: "components[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/amount}
        - {kind: slot, source: "components[].label", subject: "components[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/label}
        - {kind: slot, source: "components[].notes", subject: "components[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/notes}
        - {kind: slot, source: "components[].primary", subject: "components[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/primary}
        - {kind: slot, source: notes, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/notes}
        - {kind: inlined-node, source: "concerns[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/concerns, target: Concern}
        - {kind: slot, source: "concerns[].kind", subject: "concerns[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/concern_kind}
        - {kind: slot, source: "concerns[].text", subject: "concerns[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/concern_text}
    - source: dashboards
      root_class: Dashboard
      document_shape: mapping
      identity: {source: id, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/id}
      instructions:
        - {kind: slot, source: id, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/id}
        - {kind: alias, source: name, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/label}
        - {kind: slot, source: description, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/description}
        - {kind: slot, source: benefit.description, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/benefit_description}
        - {kind: slot, source: risk.description, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/risk_description}
        - {kind: inlined-node, source: "selectors[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/selectors, target: DashboardSelector}
        - {kind: slot, source: "selectors[].category", subject: "selectors[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/category}
        - {kind: slot, source: "selectors[].term", subject: "selectors[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/selector_term}
        - {kind: sequence, source: "declares_context[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/declares_context}
    - source: stacks
      root_class: Stack
      document_shape: keyed-map
      identity: {source: "<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/id}
      instructions:
        - {kind: inlined-node, source: "<key>[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/entries, target: StackEntry}
        - {kind: reference, source: "<key>[]", subject: "<key>[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/product, target: Product}
    - source: pillboxes
      root_class: Pillbox
      document_shape: keyed-map
      identity: {source: "<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/id}
      instructions:
        - {kind: inlined-node, source: "<key>.slots.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/slots, target: Slot}
        - {kind: slot, source: "<key>.label", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/label}
        - {kind: slot, source: "<key>.slots.<key>.label", subject: "<key>.slots.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/label}
        - {kind: slot, source: "<key>.slots.<key>.order", subject: "<key>.slots.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/order}
        - {kind: slot, source: "<key>.slots.<key>.near", subject: "<key>.slots.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/near}
        - {kind: slot, source: "<key>.slots.<key>.food", subject: "<key>.slots.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/food}
    - source: assertions
      catalog_role: assertions
      root_class: RelationAssertionCatalog
      document_shape: mapping
      instructions:
        - {kind: keyed-map, source: "governance_defaults.evidence[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/governance_defaults/evidence}
        - {kind: opaque-value, source: governance_defaults.legacy_preserved, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/governance_defaults/legacy_preserved}
        - {kind: opaque-value, source: governance_defaults.owner, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/governance_defaults/owner}
        - {kind: opaque-value, source: governance_defaults.review_by, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/governance_defaults/review_by}
        - {kind: opaque-value, source: governance_defaults.scope.planner, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/governance_defaults/scope/planner}
        - {kind: opaque-value, source: governance_defaults.status, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/governance_defaults/status}
        - {kind: sequence, source: "relations[].action", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/relations/action}
        - {kind: sequence, source: "relations[].assertion_kind", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/relations/assertion_kind}
        - {kind: sequence, source: "relations[].id", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/relations/id}
        - {kind: sequence, source: "relations[].reason", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/relations/reason}
        - {kind: sequence, source: "relations[].semantic_family", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/relations/semantic_family}
        - {kind: sequence, source: "relations[].severity", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/relations/severity}
        - {kind: sequence, source: "relations[].source_selector.category", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/relations/source_selector/category}
        - {kind: reference, source: "relations[].source_selector.entity.id", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/relations/source_selector/entity/id, target: IdentifiedNode}
        - {kind: slot, source: "relations[].source_selector.entity.name", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/relations/source_selector/entity/name}
        - {kind: sequence, source: "relations[].source_selector.term", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/relations/source_selector/term}
        - {kind: sequence, source: "relations[].target_selector.category", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/relations/target_selector/category}
        - {kind: reference, source: "relations[].target_selector.entity.id", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/relations/target_selector/entity/id, target: IdentifiedNode}
        - {kind: slot, source: "relations[].target_selector.entity.name", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/relations/target_selector/entity/name}
        - {kind: sequence, source: "relations[].target_selector.term", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/relations/target_selector/term}
        - {kind: sequence, source: "relations[].type", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/legacy/relations/type}
linkml_root: ontology/supp_slotter.yaml
linkml_modules: [ontology/model.yaml, ontology/vocabulary-model.yaml, ontology/scheduling-model.yaml, ontology/governance-model.yaml, ontology/assertion-model.yaml, ontology/runtime-protocol.yaml]
compiler:
  id: supp-slotter-ontology-compiler
  version: "1"
  format: supp-slotter.runtime-vocabulary/v2
  tool_versions:
    linkml_runtime: "1.11.1"
    pyyaml: "6.0.3"
artifacts:
  - card.schema.json
  - schema.json
  - ontology.ttl
  - shapes.ttl
  - context.json
  - projection-map.json
  - runtime-program.json
  - runtime-vocabulary.yaml
  - artifact-lock.json
runtime_vocabulary_format: supp-slotter.runtime-vocabulary/v2
