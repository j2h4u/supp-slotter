schema_version: "2"
base_iri: https://j2h4u.github.io/supp-slotter/ontology/v1/
catalogs:
  - id: semantic_vocabulary
    role: vocabulary
    path: ontology/vocabulary.yaml
    root_class: VocabularyCatalog
  - id: ontoclean
    role: ontoclean
    path: ontology/ontoclean.yaml
    root_class: OntoCleanCatalog
  - id: relation_types
    role: relation_types
    path: ontology/relations.yaml
    root_class: RelationCatalog
  - id: assertions
    role: assertions
    path: data/relations.yaml
    root_class: RelationAssertionCatalog
  - id: runtime_policy
    role: runtime_policy
    path: ontology/runtime-policy.yaml
    root_class: RuntimePolicyCatalog
  - id: policies
    role: policies
    path: ontology/policies.yaml
    root_class: SchedulingPolicyCatalog
  - id: constraints
    role: constraints
    path: ontology/scheduling-constraints.yaml
    root_class: SchedulingConstraintCatalog
  - id: shapes
    role: custom_shapes
    path: ontology/constraints/semantic.ttl
    root_class: ShapesGraph
repository_projection:
  format_version: repository-projection-v1
  base_iri: https://j2h4u.github.io/supp-slotter/ontology/v1/
  sources:
    - id: substances
      locator:
        kind: flat_root
        path: data/substances
      root_class: Substance
    - id: products
      locator:
        kind: flat_root
        path: data/products
      root_class: Product
    - id: dashboards
      locator:
        kind: flat_root
        path: data/dashboards
      root_class: Dashboard
    - id: stacks
      locator:
        kind: explicit_path
        path: data/stacks.yaml
      root_class: Stack
    - id: pillboxes
      locator:
        kind: explicit_path
        path: data/pillboxes.yaml
      root_class: Pillbox
    - id: assertions
      locator:
        kind: catalog_ref
        catalog_id: assertions
  mappings:
    - source: substances
      root_class: Substance
      document_shape: mapping
      identity: {source: id, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/id}
      maintenance: {role: substance, label: Substance, schema_artifact: card.schema.json}
      instructions:
        - {kind: slot, source: id, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/id}
        - {kind: alias, source: name, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/label}
        - {kind: slot, source: form, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/form}
        - {kind: sequence, source: "aliases[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/aliases}
        - {kind: slot, source: notes, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/notes}
        - {kind: inlined-node, source: "concerns[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/concerns, target: Concern}
        - {kind: slot, source: "concerns[].kind", subject: "concerns[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/concern_kind}
        - {kind: slot, source: "concerns[].text", subject: "concerns[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/concern_text}
        - {kind: inlined-node, source: "knowledge.<key>[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/knowledge_assertions, target: KnowledgeAssertion}
        - {kind: path-token, source: "knowledge.<key>[]", subject: "knowledge.<key>[]", token: "<key>[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/knowledge_category}
        - {kind: slot, source: "knowledge.<key>[]", subject: "knowledge.<key>[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/knowledge_value}
        - {kind: sequence, source: "schedule.prefer_with[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/prefer_with, target: Substance}
        - {kind: inlined-node, source: "schedule.intake[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_assertions, target: ScheduleAssertion}
        - {kind: path-token, source: "schedule.intake[]", subject: "schedule.intake[]", token: "intake[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_axis}
        - {kind: slot, source: "schedule.intake[]", subject: "schedule.intake[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_value}
        - {kind: inlined-node, source: "schedule.timing[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_assertions, target: ScheduleAssertion}
        - {kind: path-token, source: "schedule.timing[]", subject: "schedule.timing[]", token: "timing[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_axis}
        - {kind: slot, source: "schedule.timing[]", subject: "schedule.timing[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_value}
        - {kind: inlined-node, source: "schedule.activity[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_assertions, target: ScheduleAssertion}
        - {kind: path-token, source: "schedule.activity[]", subject: "schedule.activity[]", token: "activity[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_axis}
        - {kind: slot, source: "schedule.activity[]", subject: "schedule.activity[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/schedule_value}
    - source: products
      root_class: Product
      document_shape: mapping
      identity: {source: id, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/id}
      maintenance: {role: product, label: Product, schema_artifact: product.schema.json}
      instructions:
        - {kind: slot, source: id, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/id}
        - {kind: alias, source: name, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/label}
        - {kind: slot, source: brand, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/brand}
        - {kind: sequence, source: "urls[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/urls}
        - {kind: inlined-node, source: "components[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/components, target: ProductComponent}
        - {kind: reference, source: "components[].substance", subject: "components[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/substance, target: Substance}
        - {kind: slot, source: "components[].amount", subject: "components[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/amount}
        - {kind: slot, source: "components[].label", subject: "components[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/label}
        - {kind: slot, source: "components[].notes", subject: "components[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/notes}
        - {kind: slot, source: notes, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/notes}
        - {kind: inlined-node, source: "concerns[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/concerns, target: Concern}
        - {kind: slot, source: "concerns[].kind", subject: "concerns[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/concern_kind}
        - {kind: slot, source: "concerns[].text", subject: "concerns[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/concern_text}
    - source: dashboards
      root_class: Dashboard
      document_shape: mapping
      identity: {source: id, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/id}
      instructions:
        - {kind: slot, source: id, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/id}
        - {kind: alias, source: name, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/label}
        - {kind: slot, source: description, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/description}
        - {kind: slot, source: benefit.description, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/benefit_description}
        - {kind: slot, source: risk.description, predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/risk_description}
        - {kind: inlined-node, source: "selectors[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/selectors, target: DashboardSelector}
        - {kind: slot, source: "selectors[].category", subject: "selectors[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/category}
        - {kind: slot, source: "selectors[].term", subject: "selectors[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/selector_term}
        - {kind: sequence, source: "declares_context[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/declares_context}
    - source: stacks
      root_class: Stack
      document_shape: keyed-map
      identity: {source: "<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/id}
      maintenance: {role: stack, label: Stack, schema_artifact: stacks.schema.json}
      instructions:
        - {kind: inlined-node, source: "<key>[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/entries, target: StackEntry}
        - {kind: reference, source: "<key>[]", subject: "<key>[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/product, target: Product}
    - source: pillboxes
      root_class: Pillbox
      document_shape: keyed-map
      identity: {source: "<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/id}
      instructions:
        - {kind: reference, source: "<key>.stack", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/stack, target: Stack}
        - {kind: inlined-node, source: "<key>.slots.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/slots, target: Slot}
        - {kind: slot, source: "<key>.label", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/label}
        - {kind: slot, source: "<key>.slots.<key>.label", subject: "<key>.slots.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/label}
        - {kind: slot, source: "<key>.slots.<key>.order", subject: "<key>.slots.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/order}
        - {kind: slot, source: "<key>.slots.<key>.near", subject: "<key>.slots.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/near}
        - {kind: slot, source: "<key>.slots.<key>.food", subject: "<key>.slots.<key>", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/food}
    - source: assertions
      catalog_role: assertions
      root_class: RelationAssertionCatalog
      document_shape: mapping
      instructions:
        - {kind: inlined-node, source: "relations[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/relations, target: RelationAssertionRecord}
        - {kind: slot, source: "relations[].action", subject: "relations[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/action}
        - {kind: slot, source: "relations[].assertion_kind", subject: "relations[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/assertion_kind}
        - {kind: slot, source: "relations[].id", subject: "relations[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/id}
        - {kind: slot, source: "relations[].reason", subject: "relations[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/reason}
        - {kind: slot, source: "relations[].semantic_family", subject: "relations[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/semantic_family}
        - {kind: slot, source: "relations[].severity", subject: "relations[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/severity}
        - {kind: slot, source: "relations[].relation_type", subject: "relations[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/relation_type}
        - {kind: inlined-node, source: "relations[].source_selector", subject: "relations[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/source_selector, target: RelationAssertionSelector}
        - {kind: inlined-node, source: "relations[].source_selector.entity", subject: "relations[].source_selector", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/entity, target: RelationAssertionEntitySelector}
        - {kind: slot, source: "relations[].source_selector.category", subject: "relations[].source_selector", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/category}
        - {kind: reference, source: "relations[].source_selector.entity.entity_id", subject: "relations[].source_selector.entity", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/entity_id, target: Substance}
        - {kind: slot, source: "relations[].source_selector.entity.name", subject: "relations[].source_selector.entity", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/name}
        - {kind: slot, source: "relations[].source_selector.term", subject: "relations[].source_selector", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/term}
        - {kind: inlined-node, source: "relations[].target_selector", subject: "relations[]", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/target_selector, target: RelationAssertionSelector}
        - {kind: inlined-node, source: "relations[].target_selector.entity", subject: "relations[].target_selector", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/entity, target: RelationAssertionEntitySelector}
        - {kind: slot, source: "relations[].target_selector.category", subject: "relations[].target_selector", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/category}
        - {kind: reference, source: "relations[].target_selector.entity.entity_id", subject: "relations[].target_selector.entity", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/entity_id, target: Substance}
        - {kind: slot, source: "relations[].target_selector.entity.name", subject: "relations[].target_selector.entity", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/name}
        - {kind: slot, source: "relations[].target_selector.term", subject: "relations[].target_selector", predicate: https://j2h4u.github.io/supp-slotter/ontology/v1/term}
linkml_root: ontology/supp_slotter.yaml
linkml_modules: [ontology/model.yaml, ontology/vocabulary-model.yaml, ontology/relation-model.yaml, ontology/scheduling-model.yaml, ontology/runtime-protocol.yaml]
compiler:
  id: supp-slotter-ontology-compiler
  version: "1"
  format: supp-slotter.runtime-vocabulary/v2
  tool_versions:
    linkml_runtime: "1.11.1"
    pyyaml: "6.0.3"
artifacts:
  - card.schema.json
  - dashboard.schema.json
  - pillboxes.schema.json
  - product.schema.json
  - relations.schema.json
  - schema.json
  - stacks.schema.json
  - ontology.ttl
  - shapes.ttl
  - context.json
  - projection-map.json
  - runtime-program.json
  - runtime-vocabulary.yaml
  - artifact-lock.json
runtime_vocabulary_format: supp-slotter.runtime-vocabulary/v2
