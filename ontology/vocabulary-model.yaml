id: https://j2h4u.github.io/supp-slotter/ontology/v1/vocabulary-model
name: supp_slotter_vocabulary_model
prefixes:
  ss: https://j2h4u.github.io/supp-slotter/ontology/v1/
  linkml: https://w3id.org/linkml/
default_prefix: ss
default_range: string
imports: [linkml:types, model]
enums:
  OntoCleanRigidity:
    permissible_values:
      rigid: {}
      anti_rigid: {}
  OntoCleanDependence:
    permissible_values:
      independent: {}
      dependent: {}
classes:
  VocabularyCatalog:
    description: Authored semantic vocabulary catalog consumed by ontology generation and runtime projection.
    slots: [semantic_categories, terms]
    slot_usage:
      semantic_categories: {required: true, inlined: true, inlined_as_list: false}
      terms: {required: true, inlined: true, inlined_as_list: true}
  VocabularyCategoryRecord:
    slots: [id, allowed_predicates, ontoclean_profile, multivalued, minimum_cardinality, maximum_cardinality]
    slot_usage:
      id: {required: true}
      allowed_predicates: {required: true}
      ontoclean_profile: {required: true}
  OntoCleanCatalog:
    description: Authored OntoClean profile catalog used by semantic category validation.
    slots: [ontoclean_profiles]
    slot_usage:
      ontoclean_profiles: {required: true, inlined: true, inlined_as_list: false}
  OntoCleanProfile:
    slots: [id, rigidity, supplies_identity, dependence]
    slot_usage:
      id: {required: true}
      rigidity: {required: true}
      supplies_identity: {required: true}
      dependence: {required: true}
  SemanticCategory:
    slots: [id, label, description, allowed_predicates, ontoclean_profile]
    slot_usage:
      label: {required: true}
      ontoclean_profile: {required: true, range: OntoCleanProfile, inlined: false}
  OntologyTerm:
    slots: [id, slug, label, description, semantic_category, ontoclean_profile]
    slot_usage:
      label: {required: true}
      description: {required: true}
      semantic_category: {required: true, range: SemanticCategory, inlined: false}
      ontoclean_profile: {required: true, range: OntoCleanProfile, inlined: false}
  TermAssignment:
    slots: [id, subject, term]
    slot_usage:
      subject: {required: true}
      term: {required: true, range: OntologyTerm, inlined: false}
  TermSelector:
    is_a: Selector
    slots: [term]
slots:
  id: {identifier: true, required: true}
  slug: {required: true}
  label:
  description: {}
  allowed_predicates: {multivalued: true}
  ontoclean_profile: {}
  supplies_identity: {range: boolean}
  rigidity: {range: OntoCleanRigidity}
  dependence: {range: OntoCleanDependence}
  multivalued: {range: boolean}
  minimum_cardinality: {range: integer}
  maximum_cardinality: {range: integer}
  semantic_categories:
    multivalued: true
    range: VocabularyCategoryRecord
    inlined: true
    inlined_as_list: false
  terms:
    multivalued: true
    range: OntologyTerm
    inlined: true
    inlined_as_list: true
  ontoclean_profiles:
    multivalued: true
    range: OntoCleanProfile
    inlined: true
    inlined_as_list: false
  semantic_category: {required: true, range: SemanticCategory}
  subject: {range: Selector, inlined: false}
  term: {required: true, range: OntologyTerm, inlined: false}
