# Closed, identity-free universal inference laws.
#
# Each row maps one admitted typed fact value to exactly one typed anchor
# value.  These are the complete scheduling laws; they never name an item,
# product, component, slot, condition, weight, action, or explanation.
food_effect_laws:
  - id: law_food_bioavailability_increases
    fact_value: bioavailability_increases
    meal_context: with_food
  - id: law_food_bioavailability_decreases
    fact_value: bioavailability_decreases
    meal_context: without_food
  - id: law_food_tolerability_improves
    fact_value: tolerability_improves
    meal_context: with_food
  - id: law_food_tolerability_worsens
    fact_value: tolerability_worsens
    meal_context: without_food
