# =============================================================================
# Substance card template
# =============================================================================
# Copy this file to data/substances/<slug>.yaml and fill it in.
# Filename convention: <slug>.yaml (no ID — `uv run python -m planner check` assigns it and
# renames the file to <slug>__sub_XXXXXXXXXX.yaml automatically).
#
# REQUIRED fields: name
# All other fields are optional but should be filled where applicable.
#
# Full ontology reference: docs/domain-model.md
# =============================================================================

# id is assigned by `uv run python -m planner check` — do NOT set it manually.
# Leave the field absent and run: uv run python -m planner check

name: ""  # Required. Canonical substance name. Use the most specific form that
          # applies, e.g. "Magnesium" not "Mag". The form: field captures the
          # specific formulation.

# form: ""  # Specific formulation, e.g. "glycinate", "pyridoxine HCl", "as retinol".
            # Shown in parentheses in the schedule. Use when the substance name alone
            # is ambiguous (e.g. two "Vitamin B6" forms need distinct form: values).

# aliases: []  # Alternative names this substance is known by.
               # Example:
               #   aliases:
               #   - 5-hydroxytryptophan
               #   - Griffonia extract

# ---------------------------------------------------------------------------
# CANONICAL PLANNING INPUT
#
# This card stores only substance/form world facts. It does not control a slot.
# Do not add a desired placement, pair preference, weight, policy, or
# constraint here. Admitted planner facts are authored, with stable substance
# or composition-role scope and provenance, in
# ontology/canonical-facts.yaml. Universal mappings from those facts to
# pressures live in ontology/canonical-laws.yaml.
#
# The runtime derives normalized pressures and publishes a layout only after
# the exact optimizer proves it Optimal. A conflict or unproved result is
# layout-free Indeterminate.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# KNOWLEDGE — review facts about this substance/form
# These fields remain review data; they do not directly create pressures or
# placement. Trait-backed namespaces are validated against the canonical
# runtime vocabulary.
# ---------------------------------------------------------------------------

# knowledge:
#   kind:                     # Structural classification. Used for class-level
#   - value: mineral          # intrinsic class for review/dashboard/context membership.
#     research_state: unassessed
#     sources: []             # See ontology/vocabulary.yaml for valid slugs.
#   effect:                   # Pharmacological effects for review.
#   - value: vasodilator      # See ontology/vocabulary.yaml for valid slugs.
#     research_state: mechanistic_only
#     sources: [https://pubmed.ncbi.nlm.nih.gov/example]
#                             # Examples: vasodilator, cholinergic_support,
#                             # pde5_inhibition, fibrinolytic
#   risk:                     # Authored reviewer-only safety / interaction facts.
#   - value: manual_review    # Never a placement instruction.
#     research_state: unassessed
#     sources: []             # See ontology/vocabulary.yaml.
#                             # Examples: manual_review, bleeding_med_interaction,
#                             # hypotension_med_interaction
#   pathway:                  # Authored reviewer-only metabolic pathway membership;
#                             # not part of the active fact projection in `planner review`.
#   - value: methylation_cycle # See ontology/vocabulary.yaml for valid slugs.
#     research_state: supported
#     sources: [https://pubmed.ncbi.nlm.nih.gov/example]
#
# Every knowledge assertion must state both research_state and sources. Use
# `unassessed` with [] when no evidence review has been recorded; a non-
# unassessed state requires one or more stable source locators.

# ---------------------------------------------------------------------------
# CONCERNS
# Documented caveats, safety and data quality issues. These appear in
# planner review > Safety / Data Quality / Model Gaps by concern kind. Add one
# entry per distinct concern. Do not over-flag — only add what is actionable or
# genuinely uncertain.
# ---------------------------------------------------------------------------

# concerns:
# - kind: safety        # See ontology/model.yaml ConcernKind.
#   text: ""            # Specific concern text. State the mechanism, the source
#                       # if known, and whether it is currently relevant.
#
# - kind: data_quality
#   text: ""
#
# - kind: model_gap
#   text: ""            # Use for cases where the planner's trait/relation model
#                       # cannot fully represent a known property of this substance.
