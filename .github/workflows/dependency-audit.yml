name: Dependency audit

on:
  pull_request:
    branches: [main]
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches: [main]
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "19 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: just

      - name: Install dependencies
        run: uv sync --locked

      - name: Audit locked dependencies
        run: just deps-audit
