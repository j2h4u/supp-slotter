name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".planning/**"
      - "**/*.md"
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LINK_MODE: hardlink

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: classify
        name: Classify changed files
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" =~ ^0+$ ]]; then
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          git diff --name-only "$base" "$head" > changed-files.txt
          if grep -Ev '^(\.planning/|docs/.*|README\.md$|AGENTS\.md$|LICENSE$|.*\.md$)' changed-files.txt >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pinned provenance history
        run: git fetch --no-tags origin refs/tags/provenance/slot-policy-pre-v1:refs/tags/provenance/slot-policy-pre-v1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install dependencies
        run: uv sync --locked --group ontology

      - name: Release gate
        run: just release

  ci:
    if: always()
    runs-on: ubuntu-latest
    needs: [changes, release]
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
