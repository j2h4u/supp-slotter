semantic_enrichment_attempted_on: '2026-08-13'
notes: Zinc monomethionine form listed on active Life Extension Only Trace Minerals (20 mg elemental zinc) and other registered products. Kept separate because methionine-chelated zinc is product-distinct; phytate and meal composition can reduce absorption while food may improve tolerability, so these directions do not establish a universal meal rule. NIH ODS notes zinc is required for hundreds of enzymes and supports immune function, protein/DNA synthesis, wound healing, and cell signaling. Higher supplemental zinc can depress copper status; no fixed copper/iron interval or form-superiority claim is established.
