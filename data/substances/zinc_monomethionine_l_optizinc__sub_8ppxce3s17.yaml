id: sub_8ppxce3s17
name: Zinc
form: monomethionine / L-OptiZinc
aliases:
- L-OptiZinc
- zinc monomethionine
notes: Zinc monomethionine / L-OptiZinc is a product-specific zinc form listed on Life Extension Only Trace Minerals (20 mg elemental zinc) and other registered products; this preserves form identity without implying superiority. NIH ODS supports generic zinc physiology including immune function, protein and DNA synthesis, wound healing, and cell signaling. Phytate and meal composition can affect absorption, while food may improve tolerability, but this evidence does not establish a universal food rule. Chronic supplemental zinc can affect copper balance, and substantial concurrent supplemental iron context warrants review, but neither establishes a fixed separation interval.
