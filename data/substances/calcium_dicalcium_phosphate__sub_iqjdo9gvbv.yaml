id: sub_iqjdo9gvbv
name: Calcium
form: dicalcium phosphate
notes: >-
  Dicalcium phosphate component from the TiM Electrolyte Caps label. TiM reports
  24 mg total calcium split across dicalcium phosphate and calcium lactate, with
  the per-source contribution unresolved. Calcium supports bone/tooth mineral
  structure and mediates muscle function, blood clotting, nerve transmission,
  vascular contraction/dilation, and hormone secretion; vitamin D supports active
  calcium absorption. No dicalcium-phosphate-specific superiority or schedule is
  established.
scheduling_assessment:
  intake:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/calcium-HealthProfessional/
    - https://ods.od.nih.gov/factsheets/Calcium-Consumer/
    - https://pubmed.ncbi.nlm.nih.gov/2935812/
    summary: Calcium meal guidance is form-specific, and the human calcium-phosphate absorption study does not validate a meal preference for this low-dose dicalcium phosphate component; no dicalcium-phosphate-specific superiority or schedule is established.
  timing:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/calcium-HealthProfessional/
    summary: No comparative morning or evening rule was demonstrated for calcium.
  activity:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/calcium-HealthProfessional/
    summary: The active electrolyte product is in training, but evidence does not establish pre-, during-, or post-workout calcium placement.
