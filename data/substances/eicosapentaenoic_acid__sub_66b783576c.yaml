semantic_enrichment_attempted_on: '2026-08-13'
notes: 'Omega-3 fatty acid component listed as EPA on the active Psalae krill-oil label at 80 mg per softgel. The EPA amount is known; carrier allocation/source form remains unresolved. Formulation, dose, and bleeding-medication context limit transferability. NIH ODS and human PK evidence do not establish a product-independent meal or clock-time rule. Vitamin E is relevant antioxidant context for omega-3 PUFA intake.'
concerns:
- kind: data_quality
  text: The active Psalae krill-oil label discloses 80 mg EPA per softgel, but the EPA carrier allocation/source form remains unresolved; Minami Nattokinase lists EPA/fish oil without a per-component amount.
