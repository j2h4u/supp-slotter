notes: 'Omega-3 fatty acid component listed as EPA on the Minami Healthy Foods nattokinase label. The active product is low-dose, phospholipid-rich krill oil; formulation, dose, and bleeding-medication context limit transferability. NIH ODS and human PK evidence do not establish a product-independent meal or clock-time rule. Vitamin E is relevant antioxidant context for omega-3 PUFA intake.'
