id: sub_66b783576c
name: Eicosapentaenoic acid
aliases:
- EPA
notes: 'EPA occurs here as daily 80 mg krill/phospholipid and episodic 504 mg fish-oil ethyl ester. Gram-dose evidence is not magnitude-applicable to these products; bleeding remains medication and surgery review context, and skin findings conflict. No product-independent meal or clock-time rule is established.'
concerns:
- kind: data_quality
  text: The active Psalae krill-oil label discloses 80 mg EPA per softgel, but the EPA carrier allocation/source form remains unresolved; Minami Nattokinase lists EPA/fish oil without a per-component amount.
scheduling_assessment:
  intake:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/Omega3FattyAcids-HealthProfessional/
    - https://pubmed.ncbi.nlm.nih.gov/28344197/
    - https://pubmed.ncbi.nlm.nih.gov/25884846/
    summary: Food and formulation affect studied omega-3 absorption in bidirectional and product-dependent ways; no direct comparison establishes a universal meal requirement for the active low-dose phospholipid-rich krill product. Its 80 mg EPA per softgel is known, but carrier allocation/source form remains unresolved.
  timing:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/Omega3FattyAcids-HealthProfessional/
    - https://pubmed.ncbi.nlm.nih.gov/28344197/
    - https://pubmed.ncbi.nlm.nih.gov/25884846/
    summary: Meal-relative PK findings do not establish a morning or evening clock-time rule; no clock preference is justified for the exact form and dose.
