name: Creatine
form: monohydrate
notes: 'Creatine monohydrate is the exact active form for this card, labeled 5 g per serving. Chronic consistent intake and muscle saturation dominate over acute clock timing. The prefer_with link to L-Citrulline records co-use only and does not establish synergy (PMID 40010353).'
