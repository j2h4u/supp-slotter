name: Creatine
form: monohydrate
notes: 'Creatine monohydrate is the exact active Do4a form, labeled 5 g per serving. Chronic consistent intake and muscle saturation dominate over acute clock timing; carbohydrate co-ingestion may modestly affect retention but is not required. The registered prefer_with link to L-Citrulline is a co-use fact, not a proven synergy. Sources: PMID 8899067; ISSN PMC5469049; https://www.lsgeotar.ru/supplements/do4a-lab-creatine-monohydrate-AFMC.'
