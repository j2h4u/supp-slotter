name: L-Citrulline
form: malate
semantic_enrichment_attempted_on: '2026-08-13'
notes: 'L-Citrulline bonded with malic acid; the active unbranded product states 5 g with unresolved malate ratio and product metadata. Genius Pre is a registered but inactive product whose label states 6 g of 2:1 citrulline malate. Acute pre-exercise studies support only a low-confidence heuristic; no superiority over chronic random-time daily dosing is established. Converted to arginine and studied in nitric-oxide/exercise contexts. Sources: PMID 17953788; PMID 39662304; PMC13304508.'
