notes: 'This card represents the sodium ascorbate component of the exact VitaMeal Vitamin C product, not a generic sodium-ascorbate product. The VitaMeal label lists 900 mg L-sodium ascorbate, including 800 mg vitamin C and approximately 104 mg sodium; the product page is the source for the product composition and meal direction. Generic vitamin C physiology transfers to this form as vitamin C context, but does not establish superiority of sodium ascorbate or any other supplemental form. Buffered vitamin C context is retained; sodium is separately modeled on the Product component.'
