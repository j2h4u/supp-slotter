id: sub_25b049a598
name: Boron
notes: Generic elemental boron contribution. Product cards keep the concrete source form in component labels and notes. NIH
  ODS says boron is not classified as an essential human nutrient, but may affect calcium metabolism, bone formation, brain
  function, insulin/energy-substrate metabolism, immunity, and steroid hormone function including vitamin D and estrogen.
knowledge:
  effect:
  - bone_mineral_metabolism_support
  kind:
  - mineral
scheduling_assessment:
  intake:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/Boron-HealthProfessional/
    summary: The cited evidence does not establish an intake preference for boron citrate/aspartate/glycinate; it addresses boron generally without a validated form-specific comparator rule.
  timing:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/Boron-HealthProfessional/
    summary: No general clock-time scheduling rule was demonstrated.
