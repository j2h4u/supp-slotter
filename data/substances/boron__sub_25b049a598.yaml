id: sub_25b049a598
name: Boron
notes: Generic elemental boron contribution. The active Life Extension product supplies 3 mg from a citrate/aspartate/glycinate complex; other registered products use citrate or calcium fructoborate. NIH ODS does not classify boron as an essential human nutrient; limited, form-sensitive bone context remains uncertain and does not establish broad brain, immunity, insulin, energy, estrogen, vitamin-D, or hormone benefits.
knowledge:
  effect:
  - bone_mineral_metabolism_support
  kind:
  - mineral
scheduling_assessment:
  intake:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/Boron-HealthProfessional/
    summary: The cited evidence does not establish an intake preference for boron citrate/aspartate/glycinate; it addresses boron generally without a validated form-specific comparator rule.
  timing:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/Boron-HealthProfessional/
    summary: No general clock-time scheduling rule was demonstrated.
