id: sub_230c5c820e
name: Vitamin B1
form: thiamine
notes: 'Country Life Coenzyme B-Complex supplies thiamine hydrochloride plus thiamine cocarboxylase chloride, 50 mg total per 2 capsules; the split between forms is not disclosed, and no superiority of the coenzyme form over thiamine hydrochloride is established. Thiamin is a core cofactor for cellular energy metabolism and normal cell growth/function.'
scheduling_assessment:
  intake:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/Thiamin-HealthProfessional/
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC9960539/
    summary: Evidence does not establish a general fed or fasted preference for the mixed thiamine hydrochloride and thiamine cocarboxylase chloride product; formulation-specific evidence does not identify a meal-state rule for this exact mixture.
  timing:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/Thiamin-HealthProfessional/
    summary: No general clock-time rule was demonstrated for thiamin supplementation.
  activity:
    conclusion: insufficient
    sources:
    - https://pubmed.ncbi.nlm.nih.gov/8815395/
    - https://pubmed.ncbi.nlm.nih.gov/25566430/
    summary: Exercise-related thiamin evidence does not establish a pre-, during-, or post-workout placement rule for supplementation.
