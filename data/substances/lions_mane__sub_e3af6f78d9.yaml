    - https://doi.org/10.3389/fnut.2025.1405796
    summary: Research on Lion's Mane does not directly establish a general fed or fasted preference for this exact extract.
  timing:
    conclusion: insufficient
    sources:
    - https://doi.org/10.3389/fnut.2025.1641246
    - https://doi.org/10.3389/fnut.2025.1405796
    summary: No general clock-time rule was demonstrated for Lion's Mane supplementation.
