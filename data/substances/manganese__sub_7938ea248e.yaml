scheduling_assessment:
  intake:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/Manganese-HealthProfessional/
    - https://pubmed.ncbi.nlm.nih.gov/2856562/
    - https://pubmed.ncbi.nlm.nih.gov/1957822/
    - https://www.lifeextension.com/vitamins-supplements/item01328/only-trace-minerals
    summary: A 12-person study of a mixed supplement containing 2.5 mg manganese sulfate estimated higher manganese absorption fasting (9 +/- 3%) than with a light meal (2 +/- 1%), while a later paired human meal study found no significant effect from most tested components except calcium added to human milk. These old, small, matrix-specific findings, together with ODS-described dependence on dietary iron status, do not establish a universal food rule for generic manganese; Life Extension's current with-food instruction is product guidance.
  timing:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/Manganese-HealthProfessional/
    summary: ODS describes manganese absorption and food, dose, form, and iron-status factors but provides no evidence for a general clock-time preference.
  activity:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/Manganese-HealthProfessional/
    summary: ODS provides no exercise or workout-placement evidence for manganese; no pre-, during-, or post-workout rule is established.
