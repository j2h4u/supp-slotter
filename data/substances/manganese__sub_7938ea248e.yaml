id: sub_7938ea248e
name: Manganese
notes: Generic elemental manganese contribution. The active Life Extension Only Trace Minerals product supplies 2 mg elemental manganese
  as manganese sulfate; product cards keep that concrete source form in component labels and notes. NIH ODS describes manganese as a cofactor
  for manganese superoxide dismutase (MnSOD), arginase, and pyruvate carboxylase, but these intrinsic enzyme roles do not establish a
  supplementation benefit in manganese-replete people. Absorption varies with dose, dietary matrix, and iron status; an old small fasting
  tracer study and a matrix-specific human meal study do not establish a universal food rule. Excess exposure can cause central-nervous-system
  toxicity, with greater susceptibility in iron deficiency or chronic liver disease; this bounded context does not assert harm at the product's
  2 mg serving.
