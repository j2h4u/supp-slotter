notes: 'DHA occurs here as low-dose krill phospholipid (40 mg) and higher-dose fish-oil ethyl ester (378 mg). Meal effects are formulation- and dose-dependent; no universal meal or clock-time rule is established. Platelet/bleeding, skin, and vascular findings are bounded by dose, formulation, and study context.'
