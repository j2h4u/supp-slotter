name: Choline
form: bitartrate
notes: Choline bitartrate form disclosed on the GLS Ежовик гребенчатый с холином label.
  The label amount is for choline bitartrate and is not reinterpreted as elemental
  choline. Human evidence found higher TMAO/platelet reactivity at 1,000 mg/day
  choline bitartrate (411 mg free choline); direct harm and applicability to this
  product's 160 mg compound mass/capsule are not established. The planner is
  dose-agnostic.
