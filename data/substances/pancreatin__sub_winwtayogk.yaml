notes: Knowledge-only broad digestive-enzyme reference card. Added because pancreatin is a common digestive-enzyme supplement
  category and a clinical pancreatic-enzyme replacement comparator. Pancreatic-enzyme use is meal-coupled; prescription replacement
  enzymes are taken with each meal/snack. The current food=true slot is a soft approximation and does not encode per-meal dosing
  or distinguish OTC blends from prescription PERT. Sources checked - MedlinePlus pancrelipase information; PubMed review on
  digestive enzyme supplementation.
concerns:
- kind: safety
  text: Review pancreatic disease, exocrine pancreatic insufficiency, pork allergy or animal-source concerns, gout/hyperuricemia
    context, dose in lipase units, and whether prescription PERT rather than OTC supplementation is indicated.
- kind: data_quality
  text: Product cards should distinguish OTC digestive-enzyme blends from prescription pancrelipase/PERT and capture amylase,
    lipase, and protease activity units.
