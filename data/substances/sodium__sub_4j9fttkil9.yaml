notes: >-
  Generic sodium ion contribution. Product cards keep the concrete salt source in component labels and notes, for example
  sodium chloride, tribasic sodium citrate, or calculated sodium from sodium ascorbate. Sodium is an electrolyte context for
  extracellular fluid balance, blood volume, nerve/muscle function, and blood-pressure review; product dose and total diet
  determine whether it is beneficial or excess. Activity relevance is conditional on duration, environment, sweat, fluid,
  and individual sodium loss. Sources: NATA PMID 28985128; ACSM PMID 17277604.
