id: sub_877c24aad4
name: Nattokinase
notes: 'Serine protease derived from Bacillus subtilis natto fermentation. FU is an activity-unit label; registered products differ materially, including active Airboy quick-release 6000 FU per 2 capsules (manufacturer/formulation not independently verified) and unassigned Minami 13000 FU. The exact Airboy quick-release product differs from the human NSK-SD preparation; human studies report surrogate coagulation/fibrinolytic markers, not clot treatment or a blood-pressure claim. Oral active bioavailability and food effects remain unresolved. Sources: PMID 17520440; PMID 23709455; PMID 26109079; PMID 19358933; NIH DSLD label 82020.'
concerns:
- kind: safety
  text: Review anticoagulant and antiplatelet medicines, other bleeding-risk medicines, bleeding history, and planned procedures because human studies and case reports report coagulation/fibrinolytic marker effects; this is not a categorical contraindication or a fixed surgery-day interval.
