id: sub_p5qxdnxu9e
name: Calcium
form: lactate
notes: TiM Electrolyte Caps reports 24 mg total calcium split across dicalcium phosphate and calcium lactate, with the per-source
  contribution unresolved. Calcium supports bone/tooth mineral structure and mediates muscle function, blood clotting, nerve
  transmission, vascular contraction/dilation, and hormone secretion; vitamin D supports active calcium absorption. No
  lactate-specific benefit or scheduling rule is established.
scheduling_assessment:
  intake:
    conclusion: insufficient
