    - https://pubmed.ncbi.nlm.nih.gov/3614304/
    - https://pubmed.ncbi.nlm.nih.gov/12059174/
    summary: Calcium food guidance is salt-specific; the available evidence does not establish a meal preference for this exact calcium lactate component, and TiM's 24 mg calcium is split across dicalcium phosphate and lactate with source contributions unresolved.
  timing:
    conclusion: insufficient
    sources:
