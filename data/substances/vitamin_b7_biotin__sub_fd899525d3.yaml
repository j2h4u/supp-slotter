id: sub_fd899525d3
name: Vitamin B7
form: biotin
notes: 'Coenzyme B-Complex component. NIH ODS describes biotin as a cofactor for carboxylases involved in fatty-acid, glucose, and amino-acid metabolism. Lab-interference evidence commonly concerns 5–10 mg/day, versus the active product serving at 0.2 mg; applicability to the active serving and any withholding duration remain unresolved and do not establish a universal threshold or interval.'
