    summary: Research on biotin does not directly establish a general fed or fasted preference for this exact form.
  timing:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/Biotin-HealthProfessional/
    - https://www.ncbi.nlm.nih.gov/books/NBK114297/
    summary: No general clock-time rule was demonstrated for biotin supplementation.
  activity:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/Biotin-HealthProfessional/
    - https://www.ncbi.nlm.nih.gov/books/NBK114297/
    summary: No workout- or activity-linked placement rule was demonstrated for biotin supplementation.
concerns:
- kind: safety
  text: Biotin can interfere with some lab immunoassays and produce falsely high or low results; NIH ODS/FDA highlight thyroid-test distortion and falsely low troponin
    results as clinically important examples. Applicability to the active 200 mcg serving and any withholding duration remain unresolved; the appropriate action is assay-specific, with no universal threshold or interval established.
