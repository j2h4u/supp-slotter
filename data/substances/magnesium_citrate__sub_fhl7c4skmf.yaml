id: sub_fhl7c4skmf
name: Magnesium
form: citrate
notes: Magnesium citrate component from the TiM Electrolyte Caps label. Citrate tends to be more bioavailable than oxide or sulfate, but this is not meal or workout evidence. NIH ODS describes magnesium as a cofactor for more
  than 300 enzyme systems, including energy production, glucose and blood-pressure regulation, muscle/nerve function, calcium/potassium
  ion transport, normal heart rhythm, and bone structure.
