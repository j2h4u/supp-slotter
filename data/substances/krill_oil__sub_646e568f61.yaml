notes: 'Omega-3 oil from Antarctic krill (Euphausia superba). Human relative-bioavailability findings versus fish oil are mixed and formulation- and dose-dependent. The active Psalae product discloses 100 mg phospholipids per softgel; inactive Nature''s Truth label/practice is corroborating only, and its formulation cannot be transferred to Psalae. Extra dietary fat is not established as required. Preserve bleeding-medication review without a categorical blood-thinning claim. Sources: PMID 30799231; PMID 25884846; PMID 26328782; NIH ODS Omega-3 Fatty Acids.'
