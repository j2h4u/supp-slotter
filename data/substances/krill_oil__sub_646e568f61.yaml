    - https://pubmed.ncbi.nlm.nih.gov/25884846/
    - https://pubmed.ncbi.nlm.nih.gov/26328782/
    summary: 'Low-confidence soft food preference: human relative-bioavailability findings are mixed across different formulations, carriers, and doses; the active Psalae product provides 100 mg phospholipids per softgel but its matrix is unverified. A high-fat meal is not required.'
