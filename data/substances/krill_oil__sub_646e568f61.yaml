id: sub_646e568f61
name: Krill Oil
semantic_enrichment_attempted_on: '2026-08-13'
notes: 'Omega-3 oil from Antarctic krill (Euphausia superba). Human relative-bioavailability findings versus fish oil are mixed and formulation- and dose-dependent; the active product discloses 100 mg phospholipids without an EPA/DHA carrier split. Extra dietary fat is not established as required. Preserve bleeding-medication review without a categorical blood-thinning claim. Sources: PMID 30799231; PMID 25884846; PMID 26328782; NIH ODS Omega-3 Fatty Acids.'
