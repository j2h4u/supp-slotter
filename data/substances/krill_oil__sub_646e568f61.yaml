id: sub_646e568f61
name: Krill Oil
notes: 'Omega-3 oil from Antarctic krill (Euphausia superba). The active Psalae label lists 500 mg krill oil providing 120 mg omega-3 (80 mg EPA and 40 mg DHA), 100 mg phospholipids, and 200 mcg astaxanthin per softgel; the matrix is unverified. A soft food preference is bounded; extra dietary fat is not required. Krill oil is not a blood thinner, while bleeding-medication evidence remains insufficient for a categorical claim. Sources: PMID 30799231; PMID 25884846; PMID 26328782; NIH ODS Omega-3 Fatty Acids; NCCIH Omega-3 Supplements.'
