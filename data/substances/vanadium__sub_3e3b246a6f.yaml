id: sub_3e3b246a6f
name: Vanadium
notes: Generic elemental vanadium contribution. The active trace-mineral product supplies 750 mcg elemental vanadium from 3.75 mg vanadyl sulfate; another registered product uses vanadium citrate. Applicability is bounded by product form and dose. NASEM reports that no biological role for vanadium in humans has been identified and no intake requirement is established. Pharmacologic diabetes studies do not establish routine benefit or transfer to this low-dose exposure. The adult 1.8 mg/day UL is animal renal-toxicity-derived and carries uncertainty; GI intolerance is a relevant context.
concerns:
- kind: safety
  text: Review GI intolerance, renal context, and antidiabetes medication use before treating vanadium as routine support; the 750 mcg elemental exposure is below the 1.8 mg/day adult UL, but the UL is animal renal-toxicity-derived with uncertainty. Glucose/insulin concerns are conditional and mechanistic; no demonstrated interaction, efficacy, contraindication, or timing schedule is established.
scheduling_assessment:
  intake:
    conclusion: insufficient
    sources:
    - https://www.ncbi.nlm.nih.gov/books/NBK222322/
    - https://pubmed.ncbi.nlm.nih.gov/18319296/
    - https://doi.org/10.2903/j.efsa.2008.634
    summary: No fed-versus-fasted comparison at the active 750 mcg elemental exposure establishes an intake preference; any food direction on a product label is product-level and does not generalize across vanadium forms or doses.
  timing:
    conclusion: insufficient
    sources:
    - https://www.ncbi.nlm.nih.gov/books/NBK222322/
    - https://pubmed.ncbi.nlm.nih.gov/18319296/
    - https://doi.org/10.2903/j.efsa.2008.634
    summary: No comparative clock-time evidence establishes a timing rule for the active vanadium exposure or across vanadium forms and doses.
  activity:
    conclusion: insufficient
    sources:
    - https://www.ncbi.nlm.nih.gov/books/NBK222322/
    - https://pubmed.ncbi.nlm.nih.gov/18319296/
    - https://doi.org/10.2903/j.efsa.2008.634
    summary: No evidence establishes a workout- or activity-linked timing rule for the active vanadium exposure; no activity placement is supported.
