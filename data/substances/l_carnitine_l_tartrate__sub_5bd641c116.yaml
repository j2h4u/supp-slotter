id: sub_5bd641c116
name: L-Carnitine
form: L-tartrate
aliases:
- LCLT
notes: 'L-tartrate salt form of L-carnitine. The active Primecraft label states 775 mg L-carnitine L-tartrate (LCLT) yielding 530 mg L-carnitine per capsule; exercise evidence commonly uses 1–3 g/day for multiweek protocols, so those protocols do not transfer directly to this product. LCLT supports peripheral mitochondrial fatty-acid transport context; recovery and TMAO implications remain bounded, host-context-dependent review topics. Sources: NIH ODS Carnitine; DailyMed levocarnitine; PMID 15591001; PMID 17313301; PMID 34684429; PMID 34959912; PMID 23563705; Primecraft label.'
concerns:
- kind: safety
  text: TMAO formation from L-carnitine is gut-microbiome and host-context dependent; review cardiometabolic context rather than treating L-carnitine as directly harmful alone.
