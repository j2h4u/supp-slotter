id: sub_396c221c31
name: Picamilon
form: sodium nicotinoyl gamma-aminobutyrate
notes: 'Synthetic conjugate of GABA and niacin (nicotinic acid), developed in the
  USSR. The registered Russian tablet instruction identifies the active substance as
  the sodium salt of N-nicotinoyl-gamma-aminobutyric acid and states that tablets are
  taken independently of meals. The same instruction lists allergic reactions (rash,
  itching), dizziness, headache, mild nausea, irritability, anxiety, and excitation as
  adverse effects; contraindications include hypersensitivity, chronic renal failure,
  pregnancy, lactation, and children under 3 years; it reports shortened barbiturate
  action and potentiation of opioid analgesics. Classified as a prescription drug in
  Russia and not a lawful dietary ingredient for US dietary supplements under the FDA''s
  2015 action. A 2023 broad-panel assay found weak or no binding for parent picamilon
  against 50 tested biological targets (PMID 36668678); this is limited evidence under
  tested conditions and does not establish clinical efficacy or inefficacy. Sources:
  registered Russian instruction (Medi.ru); Russian medicines registry; FDA 2015
  scientific memorandum and constituent action; PubMed 36668678.'
