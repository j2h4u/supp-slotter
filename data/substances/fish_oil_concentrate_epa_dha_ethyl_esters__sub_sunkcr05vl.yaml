name: Fish Oil Concentrate
form: EPA/DHA ethyl esters
aliases:
- fish oil concentrate
notes: 'Concrete fish-oil concentrate identity for the Solgar Omega-3 product. The
  official formulation supplies 1400 mg fish-oil concentrate per softgel, including
  EPA 504 mg, DHA 378 mg, and other omega-3 68 mg; the nested EPA/DHA amounts are
  product composition facts and are not additive to the concentrate amount. Food scheduling
  is a soft formulation-specific heuristic, not a universal rule for EPA or DHA. Sources:
  Solgar official label; PMID 2847723; PMID 30799231.'
