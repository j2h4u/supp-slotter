name: Fish Oil Concentrate
form: EPA/DHA ethyl esters
aliases:
- fish oil concentrate
notes: 'Concrete fish-oil concentrate identity for the Solgar Omega-3 product. The
  official formulation supplies 1400 mg fish-oil concentrate per softgel and 950 mg
  total omega-3, including EPA 504 mg and DHA 378 mg; the remaining 68 mg is other
  omega-3 by arithmetic (950 - 504 - 378). The nested EPA/DHA amounts are product
  composition facts and are not additive to the concentrate amount. Food scheduling
  is a soft ethyl-ester formulation heuristic, not a generic rule for EPA, DHA, or
  krill oil. Bleeding is a conditional medication and surgery review context, not a
  categorical blood-thinner claim. No supplemental vitamin E requirement is encoded;
  see PMID 9168460 and PMID 31128941. Sources: Solgar official label; PMID 2847723;
  PMID 30799231.'
