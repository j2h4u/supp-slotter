id: sub_7628e4f478
name: Vitamin B5
semantic_enrichment_attempted_on: '2026-08-13'
notes: 'Water-soluble Vitamin B5 family card. Registered products expose calcium pantothenate,
  calcium D-pantothenate, and pantethine mixtures at Product level; exact chemistry
  is Product-level and these forms are not chemically identical. The active Coenzyme
  B-Complex supplies calcium D-pantothenate plus pantethine, 50 mg total per 2 capsules.
  Pantothenic acid is an essential cofactor for CoA synthesis and fatty-acid metabolism;
  no general meal, clock, or form-comparative rule is established. Source: NIH ODS
  (Pantothenic Acid Fact Sheet).'
