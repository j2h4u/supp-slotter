id: sub_7628e4f478
name: Vitamin B5
notes: 'Water-soluble Vitamin B5 family card. BioGrace supplies 15 mg daily calcium pantothenate with stereochemistry unresolved; Country Life supplies 50 mg per 2 capsules as calcium D-pantothenate plus pantethine. These forms are not chemically identical and no general superiority rule is established. Mitochondrial relevance is biochemical CoA-based, not a demonstrated clinical outcome; pantethine evidence does not generalize to all B5 forms. No meal or clock-time rule is established. Source: NIH ODS (Pantothenic Acid Fact Sheet).'
scheduling_assessment:
  intake:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/PantothenicAcid-HealthProfessional/
    summary: Research does not establish a general fed-versus-fasted preference across
      the registered calcium pantothenate, calcium D-pantothenate, and pantethine
      labels.
  timing:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/PantothenicAcid-HealthProfessional/
    summary: No general clock-time rule was demonstrated across the registered B5
      forms.
