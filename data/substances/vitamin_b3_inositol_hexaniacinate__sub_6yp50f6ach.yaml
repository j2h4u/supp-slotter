name: Vitamin B3
form: inositol hexaniacinate
aliases:
- inositol hexanicotinate
- IHN
- IH6N
notes: 'Inositol hexaniacinate (IHN/IH6N) is an esterified niacin form distinct from nicotinic acid and nicotinamide. It is marketed as flush-free, but that outcome is not guaranteed; NIH ODS describes variable absorption averaging about 30% lower than nicotinic acid. Controlled human studies do not establish nicotinic-acid-equivalent lipid efficacy: a 2013 trial found no lipid improvement versus placebo, and a small pharmacokinetic study found no detectable bioavailability. Do not project nicotinic-acid efficacy, meal instructions, or high-dose risks onto this exact form. Used in Natural Factors BioCoenzymated Active B Complex and Country Life Coenzyme B-Complex.'
