    - https://countrylifevitamins.com/products/coenzyme-b-complex-caps
    summary: No direct fed-versus-fasted comparison establishes a meal preference for inositol hexaniacinate; the Country Life before/between-meals instruction is vendor guidance, and a with-meal trial is not a fed-versus-fasted comparison.
  timing:
