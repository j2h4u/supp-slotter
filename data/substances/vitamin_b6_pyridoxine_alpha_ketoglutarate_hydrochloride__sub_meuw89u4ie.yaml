id: sub_meuw89u4ie
name: Vitamin B6
form: pyridoxine alpha-ketoglutarate hydrochloride
notes: 'Country Life lists 50 mg total vitamin B6 per 2 capsules across pyridoxine HCl, pyridoxal-5-phosphate (P5P), and pyridoxine alpha-ketoglutarate hydrochloride; the split between forms is not disclosed. This card captures the labelled B6 form without projecting P5P-specific clinical or medication-interaction claims onto it.'
scheduling_assessment:
  intake:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/VitaminB6-HealthProfessional/
    - https://www.ncbi.nlm.nih.gov/books/NBK114313/
    summary: Research on B6 forms does not directly establish a general fed or fasted preference for pyridoxine alpha-ketoglutarate hydrochloride specifically.
  timing:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/VitaminB6-HealthProfessional/
    - https://www.ncbi.nlm.nih.gov/books/NBK114313/
    summary: No general clock-time rule was demonstrated for pyridoxine alpha-ketoglutarate hydrochloride supplementation.
  activity:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/VitaminB6-HealthProfessional/
    - https://www.ncbi.nlm.nih.gov/books/NBK114313/
    summary: No workout- or activity-linked placement rule was demonstrated for pyridoxine alpha-ketoglutarate hydrochloride supplementation.
concerns:
- kind: safety
  text: Long-term supplemental vitamin B6 exposure can cause sensory peripheral neuropathy; the per-form dose, total use, and duration are unresolved. Review cumulative supplemental B6 intake across all forms and products and duration using NIH ODS Vitamin B6 (https://ods.od.nih.gov/factsheets/VitaminB6-HealthProfessional/) and EFSA 2023 guidance (https://doi.org/10.2903/j.efsa.2023.8006).
