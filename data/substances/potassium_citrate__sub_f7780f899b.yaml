id: sub_f7780f899b
name: Potassium
form: citrate
notes: 'Water-soluble potassium citrate. The active TiM component supplies 66.5 mg elemental potassium per capsule; prescription urinary-alkalinization and meal/GI directions are pharmacologic or product-specific and do not establish a schedule for this low-dose electrolyte. Significant interaction contexts include renal impairment, ACE inhibitors, ARBs, potassium-sparing diuretics, and NSAIDs, which can raise hyperkalemia risk. Sources: NIH ODS Potassium Fact Sheet and DailyMed potassium labeling.'
concerns:
- kind: safety
  text: Review renal function, potassium exposure, and hyperkalemia-promoting medications; low-dose active electrolyte use does not establish a universal potassium timing rule.
scheduling_assessment:
  intake:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/Potassium-HealthProfessional/
    - https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=3dd9c9eb-df19-4ec9-bc77-f3a159b33d94
    - https://pubmed.ncbi.nlm.nih.gov/1875495/
    summary: No direct fed-versus-fasted absorption evidence establishes a meal preference for potassium citrate; GI tolerance and pharmacologic dose contexts do not transfer to the active low-dose electrolyte component, and practice may vary by tolerability.
  timing:
    conclusion: insufficient
    sources:
    - https://ods.od.nih.gov/factsheets/Potassium-HealthProfessional/
    - https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=3dd9c9eb-df19-4ec9-bc77-f3a159b33d94
    - https://pubmed.ncbi.nlm.nih.gov/1875495/
    summary: No comparative clock-time rule was demonstrated for potassium citrate; pharmacologic urinary-alkalinization timing does not transfer to this low-dose electrolyte.
  activity:
