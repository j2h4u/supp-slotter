# =============================================================================
# data/pillboxes.yaml — Pillboxes and their time slots
# =============================================================================
#
# A pillbox is a logical intake group with named slots. Each top-level key here
# must match a stack key in stacks.yaml. The planner assigns each active product
# to exactly one slot within its stack's logical group.
#
# SLOT FIELDS
# -----------
# label             Human-readable name shown in schedule.yaml.
# order             Integer display order within this topology (lower first).
# meal_context      Optional independent axis: with_food or without_food.
# circadian_anchor  Optional independent axis: wake or sleep.
# exercise_anchor   Optional independent axis: before or after.
#
# Missing axes remain missing. IDs, labels, and order have no biological
# semantics and must not be used to infer an anchor. Slots are logical,
# unbounded intake groups rather than physical compartments.
#
# CONVENTIONS
# -----------
# - Pillbox keys must match stack keys in stacks.yaml 1:1.
# - Slot IDs must be unique across ALL pillboxes (planner check enforces this).
# - The "inactive" stack has no corresponding pillbox — inactive products are
#   never assigned to a slot.
# - Slot order values must be unique within a pillbox but do not need to be
#   contiguous.
#
# =============================================================================

daily:
  label: Daily
  stack: daily
  slots:
    morning_empty:
      label: Morning / empty stomach
      order: 1
      meal_context: without_food
      circadian_anchor: wake
    morning_food:
      label: Morning / with breakfast
      order: 2
      meal_context: with_food
    day_food:
      label: Day / with meal
      order: 3
      meal_context: with_food
    evening_empty:
      label: Before sleep / empty stomach
      order: 4
      meal_context: without_food
      circadian_anchor: sleep
training:
  label: Training
  stack: training
  slots:
    pre_workout:
      label: Pre-workout
      order: 1
      meal_context: without_food
      exercise_anchor: before
    post_workout:
      label: Post-workout
      order: 2
      meal_context: without_food
      exercise_anchor: after
