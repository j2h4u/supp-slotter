# =============================================================================
# data/stacks.yaml — Product stack membership
# =============================================================================
#
# A stack is a named group of products that shares a logical intake group with
# a set of time slots. Each stack key must match a top-level key in
# pillboxes.yaml. The planner assigns every product in a stack to one of that
# group's slots.
#
# STACKS
# ------
# daily     Ordinary active routing stack. Maps to the "daily" logical intake group
#           with morning_empty / morning_food / day_food / evening_empty. A product
#           marked `use_pattern: not_every_day` remains in daily; presentation
#           separates it in the generated view, with no frequency or calendar model
#           implied.
# training  Products taken on workout days only. Maps to the "training" pillbox
#           with pre_workout / post_workout slots.
# inactive  Products that are on the shelf but not currently scheduled. Excluded
#           from plan generation, relation warnings, and slot assignment. Use this
#           instead of deleting a product card when temporarily stopping a
#           substance that is still owned.
# tracked_unassigned  Explicitly tracked products that are neither routable nor
#           on the shelf. Each record has the product ID and its current reason.
#           This collection is never an active stack and has no pillbox.
#
# CONVENTIONS
# -----------
# - Entries are product IDs (prd_*), not product names. IDs are stable; names can change.
# - Every product appears exactly once in daily, training, inactive, or
#   tracked_unassigned. Omission is invalid.
# - Order within a list does not affect scheduling.
# - To add a new product to the active stack: move its ID from inactive to daily or training.
#
# =============================================================================

